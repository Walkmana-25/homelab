name: Ansible Check

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to checkout'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          # Keep <= 3.14 while ansible-core is pinned to 2.21.x: ansible-core < 2.22
          # does not support Python 3.15 (dataclasses._is_type removal). See docs/repository-guide.md.
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: ansible/requirements.txt

      - name: Install dependencies
        working-directory: ansible
        run: |
          python -m pip install --upgrade pip
          make install-lint

      - name: Install Ansible collections
        working-directory: ansible
        run: make install-requirements

      - name: Verify Python and Ansible versions
        working-directory: ansible
        run: |
          python -V
          ansible --version
          ansible-lint --version

      - name: Run Ansible Lint and Syntax Check
        working-directory: ansible
        run: make check
