---
# Warm-only playbook: configures Harbor registry authentication on k3s nodes.
# Run AFTER Harbor is deployed (SealedSecret must exist).
# Cold-start (make install-k3s) does NOT use this — Harbor doesn't exist yet.
#
# Usage: make configure-registry
- name: Configure Harbor registry authentication on k3s nodes
  hosts: k3s_cluster
  become: true
  vars:
    registry_secret_name: harbor-registry-auth
    registry_secret_namespace: harbor
    registry_original_host: harbor-k3s.lapis-dev.work
    registry_mirror_endpoint: http://harbor-core.harbor.svc.cluster.local

  tasks:
    - name: Fetch registry credentials from Kubernetes Secret
      ansible.builtin.command:
        cmd: >-
          kubectl get secret {{ registry_secret_name }}
          -n {{ registry_secret_namespace }} -o jsonpath='{.data}'
      delegate_to: localhost
      environment:
        PATH: /home/linuxbrew/.linuxbrew/bin:/usr/local/bin:/usr/bin:/bin
        KUBECONFIG: /home/ubuntu/.kube/config
      run_once: true
      register: registry_secret
      changed_when: false

    - name: Fail when registry secret not found (Harbor not deployed?)
      ansible.builtin.fail:
        msg: >-
          Secret {{ registry_secret_name }} not found in namespace
          {{ registry_secret_namespace }}. Deploy Harbor first
          (ArgoCD sync), then run this playbook.
      when: registry_secret.rc != 0

    - name: Set registry credentials from secret
      ansible.builtin.set_fact:
        registry_username: "{{ _data.username | b64decode }}"
        registry_password: "{{ _data.password | b64decode }}"
      vars:
        _data: "{{ registry_secret.stdout | from_json }}"

    - name: Determine k3s service name
      ansible.builtin.set_fact:
        _k3s_svc: >-
          {{ 'k3s-agent'
          if inventory_hostname in groups['agent'] else 'k3s' }}

    - name: Deploy registries.yaml to nodes
      ansible.builtin.copy:
        content: |
          mirrors:
            {{ registry_original_host }}:
              endpoint:
                - "{{ registry_mirror_endpoint }}"
          configs:
            {{ registry_original_host }}:
              auth:
                username: {{ registry_username }}
                password: {{ registry_password }}
        dest: /etc/rancher/k3s/registries.yaml
        owner: root
        group: root
        mode: "0644"
      notify: Restart k3s

  handlers:
    - name: Restart k3s
      ansible.builtin.systemd:
        name: "{{ _k3s_svc }}"
        state: restarted
