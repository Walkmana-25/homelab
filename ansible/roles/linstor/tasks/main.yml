---
# LINSTOR (controller + satellite combined node) install and LVM thin pool setup.
# Linstor packages are pinned to linstor_target_version via local .deb files
# (see defaults/main.yml), held with apt-mark, and the DRBD kernel modules
# required by LINSTOR are built and loaded on this node.
#
# NOTE (review M-2 / H-1): the exact error messages and the JSON structure of
# `linstor --machine-readable` output have NOT been verified against a real
# linstor-client yet. Verify them during the first deployment and adjust the
# failed_when/until conditions below if the actual output differs.

- name: Check if block device exists
  ansible.builtin.stat:
    path: "{{ linstor_block_device }}"
  register: linstor_block_device_stat
  failed_when: not linstor_block_device_stat.stat.exists

# Review L-4: use argv (list form) consistently instead of mixing cmd/argv.
- name: Check if block device already has a filesystem
  ansible.builtin.command:
    argv: [blkid, -o, value, -s, TYPE, "{{ linstor_block_device }}"]
  register: linstor_block_device_fs
  changed_when: false
  failed_when: false

# Review M-1: `blkid -s TYPE` does not report a disk-wide partition table,
# so a GPT/MBR layout would slip past the filesystem guard below and be
# destroyed by pvcreate. Check PTTYPE separately.
- name: Check if block device has a partition table
  ansible.builtin.command:
    argv: [blkid, -o, value, -s, PTTYPE, "{{ linstor_block_device }}"]
  register: linstor_block_device_pttype
  changed_when: false
  failed_when: false

- name: Check if block device is already an LVM physical volume
  ansible.builtin.command:
    argv: [pvs, --noheadings, -o, vg_name, "{{ linstor_block_device }}"]
  register: linstor_block_device_pv
  changed_when: false
  failed_when: false

- name: Fail if block device already has a filesystem
  ansible.builtin.fail:
    msg: >-
      {{ linstor_block_device }} already contains a filesystem
      ({{ linstor_block_device_fs.stdout }}). Refusing to overwrite existing data.
  when: linstor_block_device_fs.stdout | length > 0 and linstor_block_device_fs.stdout != 'LVM2_member'

- name: Fail if block device has a partition table
  ansible.builtin.fail:
    msg: >-
      {{ linstor_block_device }} has a partition table
      ({{ linstor_block_device_pttype.stdout }}). Refusing to overwrite existing data.
  when: linstor_block_device_pttype.stdout | length > 0

- name: Fail if block device belongs to a foreign LVM volume group
  ansible.builtin.fail:
    msg: >-
      {{ linstor_block_device }} is already an LVM physical volume in volume group
      '{{ linstor_block_device_pv.stdout | trim }}'. Refusing to overwrite existing data.
  when:
    - linstor_block_device_pv.rc == 0
    - linstor_block_device_pv.stdout | trim != linstor_vg

- name: Add LINBIT PPA for LINSTOR packages
  ansible.builtin.apt_repository:
    repo: "{{ linstor_ppa_repo }}"
    codename: "{{ linstor_ppa_codename }}"
    state: present

# --- Pinned LINSTOR package install ----------------------------------------
# The cluster runs a known-good LINSTOR version. Installing linstor-* from the
# PPA would jump to the latest release, so the three linstor debs are pinned
# and installed from a local cache instead. The pin tasks below only run when
# the installed linstor-controller version differs from linstor_target_version.

# Read-only query: keep it running in check mode so the version comparison in
# every `when` below stays meaningful there.
- name: Check installed linstor-controller version
  ansible.builtin.command:
    argv: [dpkg-query, -W, '-f=${Version}', linstor-controller]
  register: linstor_controller_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: Ensure LINSTOR deb cache directory exists
  ansible.builtin.file:
    path: "{{ linstor_deb_cache_dir }}"
    state: directory
    mode: "0755"
  when: linstor_controller_version.stdout != linstor_target_version

# ansible.builtin.find does not expand braces in patterns, so use one pattern
# per package (patterns are ORed by the module).
- name: Locate pinned LINSTOR debs in local source directories
  ansible.builtin.find:
    paths: "{{ linstor_deb_sources }}"
    patterns: "{{ item }}_*.deb"
  loop:
    - linstor-common
    - linstor-controller
    - linstor-satellite
  register: linstor_source_debs
  when: linstor_controller_version.stdout != linstor_target_version

# The sources live on the target node (e.g. manually downloaded to
# /tmp/linstor-1342), hence remote_src. The `default([])` guard keeps the
# skipped register (version already matching) templatable on re-runs.
- name: Copy pinned LINSTOR debs into the cache
  ansible.builtin.copy:
    src: "{{ item.files[0].path }}"
    dest: "{{ linstor_deb_cache_dir }}/"
    remote_src: true
    mode: "0644"
  loop: "{{ linstor_source_debs.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - linstor_controller_version.stdout != linstor_target_version
    - item.files | length > 0

- name: Download missing pinned LINSTOR debs from fallback URLs
  ansible.builtin.get_url:
    url: "{{ item }}"
    dest: "{{ linstor_deb_cache_dir }}/"
    mode: "0644"
  loop: "{{ linstor_deb_urls }}"
  when:
    - linstor_controller_version.stdout != linstor_target_version
    - linstor_deb_urls | length > 0
    - linstor_source_debs.results | default([]) | selectattr('files', 'equalto', []) | list | length > 0

- name: Collect cached pinned LINSTOR debs per package
  ansible.builtin.find:
    paths: "{{ linstor_deb_cache_dir }}"
    patterns: "{{ item }}_*.deb"
  loop:
    - linstor-common
    - linstor-controller
    - linstor-satellite
  register: linstor_cached_debs
  when: linstor_controller_version.stdout != linstor_target_version

- name: Fail when the cached LINSTOR deb set is incomplete
  ansible.builtin.fail:
    msg: >-
      The pinned LINSTOR debs (linstor-common, linstor-controller and
      linstor-satellite at version {{ linstor_target_version }}) are not
      available in {{ linstor_deb_cache_dir }}. Provide the three debs in one
      of linstor_deb_sources ({{ linstor_deb_sources | join(', ') }}) or set
      linstor_deb_urls to downloadable URLs.
  when:
    - linstor_controller_version.stdout != linstor_target_version
    - linstor_cached_debs.results | default([]) | selectattr('files', 'equalto', []) | list | length > 0

# The apt module splits its deb: argument on commas and installs the files in
# a single dpkg run, so all three interdependent debs are unpacked together
# and apt never pulls linstor-common from the PPA mid-set. allow_downgrade is
# the module's documented equivalent of apt's --allow-downgrades (dpkg_options
# entries are always prefixed with '--' by the module, so passing
# '--allow-downgrades' there would produce an invalid dpkg flag).
- name: Install pinned LINSTOR debs from the local cache
  ansible.builtin.apt:
    deb: "{{ linstor_cached_debs.results | default([]) | map(attribute='files') | map('first') | map(attribute='path') | join(',') }}"
    state: present
    allow_downgrade: true
  when: linstor_controller_version.stdout != linstor_target_version

# linstor-client and lvm2 are not part of the pinned deb set: the client tracks
# the PPA (its linstor-common dependency is already satisfied by the pinned
# version), and lvm2 backs the lvg/lvol tasks below. Installed after the
# pinned debs so apt does not pull a newer linstor-common as a client
# dependency.
- name: Install LINSTOR client and LVM dependencies
  ansible.builtin.apt:
    name:
      - lvm2
      - linstor-client
    state: present
    update_cache: true
    cache_valid_time: 3600

# apt-mark reports "<pkg> was already set on hold." for each package that was
# already held, so treat that as unchanged.
- name: Hold pinned LINSTOR packages
  ansible.builtin.command:
    argv: [apt-mark, hold, linstor-common, linstor-controller, linstor-satellite]
  register: linstor_hold_packages_result
  changed_when: "'was already' not in (linstor_hold_packages_result.stdout | default(''))"
  when: linstor_hold_packages | bool

# Review C-1: never modify /etc/lvm/lvm.conf itself. community.general.ini_file
# appends an INI-style "[devices]" header to the brace-syntax file, which LVM's
# parser rejects (breaking lvm/pvs/vgs and the lvg/lvol tasks below). LVM >=
# 2.02.98 auto-loads /etc/lvm/lvm.conf.d/*.conf and merges the devices section,
# so drop a dedicated file there instead.
- name: Ensure LVM conf.d directory exists
  ansible.builtin.file:
    path: /etc/lvm/lvm.conf.d
    state: directory
    mode: "0755"

- name: Exclude DRBD and LINSTOR devices from LVM scans
  ansible.builtin.copy:
    dest: /etc/lvm/lvm.conf.d/90-linstor.conf
    content: |
      # Managed by Ansible (role: linstor). LVM >= 2.02.98 auto-loads conf.d/*.conf
      devices {
          global_filter = [ "r|^/dev/drbd|", "r|^/dev/mapper/[lL]instor|" ]
      }
    mode: "0644"
  notify: Restart linstor satellite

# --- DRBD kernel modules ----------------------------------------------------
# Merged from the former linstor_drbd role: the LINBIT PPA added above also
# publishes drbd-dkms, so no separate repository task is needed. linux-headers
# must be installed explicitly: this node does not carry kernel headers by
# default and the DKMS build requires them (plus gcc/make).
- name: Install DRBD kernel module and DKMS build dependencies
  ansible.builtin.apt:
    name:
      - "linux-headers-{{ ansible_kernel }}"
      - gcc
      - make
      - drbd-dkms
    state: present
    update_cache: true
    cache_valid_time: 3600

# Both modules are required: modprobe drbd does not pull in the tcp transport
# module automatically.
- name: Load drbd kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - drbd
    - drbd_transport_tcp

- name: Persist drbd modules across reboots
  ansible.builtin.copy:
    dest: /etc/modules-load.d/drbd.conf
    content: |
      drbd
      drbd_transport_tcp
    mode: "0644"

# modinfo resolves each module through /lib/modules/<kernel>; a non-zero rc
# means the DKMS build did not produce a loadable module.
- name: Verify drbd kernel modules are built
  ansible.builtin.command:
    argv: [modinfo, -n, "{{ item }}"]
  register: linstor_drbd_modinfo
  changed_when: false
  failed_when: linstor_drbd_modinfo.rc != 0
  loop:
    - drbd
    - drbd_transport_tcp

# Note: community.general 8.x lvol no longer creates volume groups (its argspec
# requires lv or thinpool), so use the dedicated lvg module for the VG.
- name: Create volume group for LINSTOR
  community.general.lvg:
    vg: "{{ linstor_vg }}"
    pvs:
      - "{{ linstor_block_device }}"
    state: present

# Note: community.general 8.x lvol expects `thinpool` to be the pool name (str),
# not a boolean. Passing no `lv` creates the thin pool itself.
# shrink: false keeps re-runs idempotent (100%FREE resolves to ~0 once created).
- name: Create thin pool logical volume
  community.general.lvol:
    vg: "{{ linstor_vg }}"
    thinpool: "{{ linstor_thinpool_lv }}"
    size: 100%FREE
    shrink: false
    state: present

- name: Enable and start LINSTOR services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - linstor-satellite
    - linstor-controller

- name: Wait for LINSTOR controller REST API
  ansible.builtin.wait_for:
    port: 3370
    timeout: 120

# Review M-2: list first and create only when absent, so re-runs do not depend
# on the (unverified) "already exists" error text of the linstor CLI. The
# substring check matches the node name in the table output.
- name: Check if node is already registered
  ansible.builtin.command:
    argv: [linstor, node, list]
  register: linstor_node_list_check
  changed_when: false

- name: Register node as combined controller and satellite
  ansible.builtin.command:
    argv: [linstor, node, create, "{{ linstor_node_name }}", "{{ linstor_node_ip }}", --node-type, combined]
  register: linstor_node_create
  changed_when: linstor_node_create.rc == 0
  when: linstor_node_name not in linstor_node_list_check.stdout

# Review H-1: the plain table output of `linstor node list` always contains
# the column header "Online", so the previous substring check succeeded
# immediately regardless of the actual node state. Parse the
# --machine-readable JSON instead.
# NOTE: the actual JSON structure is [[{name, connection_status, ...}]]
# (array of arrays of node objects). The field is `connection_status` with
# value "ONLINE" (all caps). Verified against linstor 1.35.0~rc.1.
- name: Wait for node to report Online
  ansible.builtin.command:
    argv: [linstor, --machine-readable, node, list]
  register: linstor_node_online
  until: >-
    linstor_node_online.rc == 0
    and linstor_node_online.stdout[:1] == '['
    and (
      (linstor_node_online.stdout | from_json)[0]
      | selectattr('name', 'equalto', linstor_node_name)
      | map(attribute='connection_status')
      | list
    ) == ['ONLINE']
  retries: 24
  delay: 5
  changed_when: false

# Review M-2: list first and create only when absent (same rationale as the
# node registration above).
- name: Check if storage pool is already registered
  ansible.builtin.command:
    argv: [linstor, storage-pool, list]
  register: linstor_storage_pool_check
  changed_when: false

# Review H-1/M-2: the satellite may report Online before it announces the
# LVMTHIN feature, in which case `storage-pool create lvmthin` fails with a
# "not supported" error. Retry to cover that race.
# failed_when is required IN ADDITION to until: in ansible-core 2.16 the until
# conditional only decides whether to keep retrying; it never clears the
# module-level failure flag set by rc != 0 (verified against
# ansible/executor/task_executor.py and by behavior tests). Without
# failed_when, an "already exists" rc=1 result would fail the task even though
# until is satisfied. With both: rc=0 succeeds, "already exists" counts as
# ok/unchanged, and a persistent failure exhausts the retries and fails.
# NOTE: the 'already exists' wording is unverified; check the real CLI output
# during the first deployment.
- name: Register LVM thin storage pool
  ansible.builtin.command:
    argv:
      - linstor
      - storage-pool
      - create
      - lvmthin
      - "{{ linstor_node_name }}"
      - "{{ linstor_storage_pool_name }}"
      - "{{ linstor_vg }}/{{ linstor_thinpool_lv }}"
  register: linstor_storage_pool_create
  changed_when: linstor_storage_pool_create.rc == 0
  failed_when: >-
    linstor_storage_pool_create.rc != 0
    and 'already exists' not in (linstor_storage_pool_create.stdout | default('')) ~ (linstor_storage_pool_create.stderr | default(''))
  retries: 6
  delay: 5
  until: >-
    linstor_storage_pool_create.rc == 0
    or 'already exists' in (linstor_storage_pool_create.stdout | default('')) ~ (linstor_storage_pool_create.stderr | default(''))
  when: linstor_storage_pool_name not in linstor_storage_pool_check.stdout

- name: Collect LINSTOR node list
  ansible.builtin.command:
    argv:
      - linstor
      - node
      - list
  register: linstor_nodes_verify
  changed_when: false

- name: Collect LINSTOR storage pool list
  ansible.builtin.command:
    argv:
      - linstor
      - storage-pool
      - list
  register: linstor_storage_pools_verify
  changed_when: false

- name: Show LINSTOR cluster state
  ansible.builtin.debug:
    msg:
      - "=== linstor node list ==="
      - "{{ linstor_nodes_verify.stdout }}"
      - "=== linstor storage-pool list ==="
      - "{{ linstor_storage_pools_verify.stdout }}"
