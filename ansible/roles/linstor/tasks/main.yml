---
# LINSTOR (controller + satellite combined node) install and LVM thin pool setup.
# Linstor packages are pinned to linstor_target_version via local .deb files
# (see defaults/main.yml), held with apt-mark, and the DRBD kernel modules
# required by LINSTOR are built and loaded on this node.

- name: Check if block device exists
  ansible.builtin.stat:
    path: "{{ linstor_block_device }}"
  register: linstor_block_device_stat
  failed_when: not linstor_block_device_stat.stat.exists
  tags: [linstor, update]

- name: Check if block device already has a filesystem
  ansible.builtin.command:
    argv: [blkid, -o, value, -s, TYPE, "{{ linstor_block_device }}"]
  register: linstor_block_device_fs
  changed_when: false
  failed_when: false
  tags: [linstor, update]

- name: Check if block device has a partition table
  ansible.builtin.command:
    argv: [blkid, -o, value, -s, PTTYPE, "{{ linstor_block_device }}"]
  register: linstor_block_device_pttype
  changed_when: false
  failed_when: false
  tags: [linstor, update]

- name: Check if block device is already an LVM physical volume
  ansible.builtin.command:
    argv: [pvs, --noheadings, -o, vg_name, "{{ linstor_block_device }}"]
  register: linstor_block_device_pv
  changed_when: false
  failed_when: false
  tags: [linstor, update]

- name: Fail if block device already has a filesystem
  ansible.builtin.fail:
    msg: >-
      {{ linstor_block_device }} already contains a filesystem
      ({{ linstor_block_device_fs.stdout }}). Refusing to overwrite existing data.
  when: linstor_block_device_fs.stdout | length > 0 and linstor_block_device_fs.stdout != 'LVM2_member'
  tags: [linstor, update]

- name: Fail if block device has a partition table
  ansible.builtin.fail:
    msg: >-
      {{ linstor_block_device }} has a partition table
      ({{ linstor_block_device_pttype.stdout }}). Refusing to overwrite existing data.
  when: linstor_block_device_pttype.stdout | length > 0
  tags: [linstor, update]

- name: Fail if block device belongs to a foreign LVM volume group
  ansible.builtin.fail:
    msg: >-
      {{ linstor_block_device }} is already an LVM physical volume in volume group
      '{{ linstor_block_device_pv.stdout | trim }}'. Refusing to overwrite existing data.
  when:
    - linstor_block_device_pv.rc == 0
    - linstor_block_device_pv.stdout | trim != linstor_vg
  tags: [linstor, update]

- name: Add LINBIT PPA for LINSTOR packages
  ansible.builtin.apt_repository:
    repo: "{{ linstor_ppa_repo }}"
    codename: "{{ linstor_ppa_codename }}"
    state: present
  tags: [linstor, update]

# --- Pinned LINSTOR package check and update -------------------------------
# The cluster runs a known-good LINSTOR version. Installing linstor-* from the
# PPA would jump to the latest release, so the three linstor debs are pinned
# and installed from a local cache instead.

- name: Check installed LINSTOR package versions
  ansible.builtin.command:
    argv: [dpkg-query, -W, '-f=${Package}=${Version}\n', linstor-common, linstor-controller, linstor-satellite]
  register: linstor_installed_packages
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [linstor, update]

- name: Determine if LINSTOR package update is required
  ansible.builtin.set_fact:
    linstor_needs_package_update: >-
      {{
        linstor_installed_packages.rc != 0
        or ('linstor-common=' ~ linstor_target_version) not in (linstor_installed_packages.stdout_lines | default([]))
        or ('linstor-controller=' ~ linstor_target_version) not in (linstor_installed_packages.stdout_lines | default([]))
        or ('linstor-satellite=' ~ linstor_target_version) not in (linstor_installed_packages.stdout_lines | default([]))
      }}
  tags: [linstor, update]

- name: Collect current LINSTOR node state before update
  ansible.builtin.command:
    argv: [linstor, node, list]
  register: linstor_pre_update_nodes
  changed_when: false
  failed_when: false
  when: linstor_needs_package_update
  tags: [linstor, update]

- name: Collect current LINSTOR storage pool state before update
  ansible.builtin.command:
    argv: [linstor, storage-pool, list]
  register: linstor_pre_update_storage_pools
  changed_when: false
  failed_when: false
  when: linstor_needs_package_update
  tags: [linstor, update]

- name: Collect current LINSTOR resource state before update
  ansible.builtin.command:
    argv: [linstor, resource, list]
  register: linstor_pre_update_resources
  changed_when: false
  failed_when: false
  when: linstor_needs_package_update
  tags: [linstor, update]

- name: Log pre-update LINSTOR state
  ansible.builtin.debug:
    msg:
      - "=== Pre-update linstor node list ==="
      - "{{ linstor_pre_update_nodes.stdout | default('N/A (initial install or service stopped)') }}"
      - "=== Pre-update linstor storage-pool list ==="
      - "{{ linstor_pre_update_storage_pools.stdout | default('N/A (initial install or service stopped)') }}"
      - "=== Pre-update linstor resource list ==="
      - "{{ linstor_pre_update_resources.stdout | default('N/A (initial install or service stopped)') }}"
  when: linstor_needs_package_update
  tags: [linstor, update]

- name: Ensure LINSTOR deb cache directory exists
  ansible.builtin.file:
    path: "{{ linstor_deb_cache_dir }}"
    state: directory
    mode: "0755"
  when: linstor_needs_package_update
  tags: [linstor, update]

# ansible.builtin.find does not expand braces in patterns, so use one pattern
# per package (patterns are ORed by the module).
- name: Locate pinned LINSTOR debs in local source directories
  ansible.builtin.find:
    paths: "{{ linstor_deb_sources }}"
    patterns: "{{ item }}_*.deb"
  loop:
    - linstor-common
    - linstor-controller
    - linstor-satellite
  register: linstor_source_debs
  when: linstor_needs_package_update
  tags: [linstor, update]

- name: Copy pinned LINSTOR debs into the cache
  ansible.builtin.copy:
    src: "{{ item.files[0].path }}"
    dest: "{{ linstor_deb_cache_dir }}/"
    remote_src: true
    mode: "0644"
  loop: "{{ linstor_source_debs.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - linstor_needs_package_update
    - item.files | length > 0
  tags: [linstor, update]

- name: Download missing pinned LINSTOR debs from fallback URLs
  ansible.builtin.get_url:
    url: "{{ item }}"
    dest: "{{ linstor_deb_cache_dir }}/"
    mode: "0644"
  loop: "{{ linstor_deb_urls }}"
  when:
    - linstor_needs_package_update
    - linstor_deb_urls | length > 0
    - linstor_source_debs.results | default([]) | selectattr('files', 'equalto', []) | list | length > 0
  tags: [linstor, update]

- name: Collect cached pinned LINSTOR debs per package
  ansible.builtin.find:
    paths: "{{ linstor_deb_cache_dir }}"
    patterns: "{{ item }}_*.deb"
  loop:
    - linstor-common
    - linstor-controller
    - linstor-satellite
  register: linstor_cached_debs
  when: linstor_needs_package_update
  tags: [linstor, update]

- name: Log source of LINSTOR debs
  ansible.builtin.debug:
    msg: "Package {{ item.item }} cached deb path: {{ item.files[0].path }}"
  loop: "{{ linstor_cached_debs.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - linstor_needs_package_update
    - item.files | length > 0
  tags: [linstor, update]

- name: Fail when the cached LINSTOR deb set is incomplete
  ansible.builtin.fail:
    msg: >-
      The pinned LINSTOR debs (linstor-common, linstor-controller and
      linstor-satellite at version {{ linstor_target_version }}) are not
      available in {{ linstor_deb_cache_dir }}. Provide the three debs in one
      of linstor_deb_sources ({{ linstor_deb_sources | join(', ') }}) or set
      linstor_deb_urls to downloadable URLs.
  when:
    - linstor_needs_package_update
    - linstor_cached_debs.results | default([]) | selectattr('files', 'equalto', []) | list | length > 0
  tags: [linstor, update]

- name: Inspect package name and version inside cached .deb files
  ansible.builtin.command:
    argv: [dpkg-deb, -W, '--showformat=${Package}=${Version}', "{{ item.files[0].path }}"]
  loop: "{{ linstor_cached_debs.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  register: linstor_deb_inspect
  changed_when: false
  when:
    - linstor_needs_package_update
    - item.files | length > 0
  tags: [linstor, update]

- name: Fail if cached deb package metadata or version is invalid
  ansible.builtin.fail:
    msg: >-
      Deb package validation failed for {{ item.item.item }}.
      Expected {{ item.item.item }}={{ linstor_target_version }}, but dpkg-deb reported: {{ item.stdout | default('N/A') }}.
  loop: "{{ linstor_deb_inspect.results | default([]) }}"
  loop_control:
    label: "{{ item.item.item }}"
  when:
    - linstor_needs_package_update
    - not item.skipped | default(false)
    - item.stdout != (item.item.item ~ '=' ~ linstor_target_version)
  tags: [linstor, update]

- name: Calculate SHA256 checksums of cached debs
  ansible.builtin.stat:
    path: "{{ item.files[0].path }}"
    checksum_algorithm: sha256
  loop: "{{ linstor_cached_debs.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  register: linstor_deb_stats
  when:
    - linstor_needs_package_update
    - item.files | length > 0
    - linstor_deb_checksums | default({}) | length > 0
  tags: [linstor, update]

- name: Fail if SHA256 checksum mismatch detected
  ansible.builtin.fail:
    msg: >-
      SHA256 checksum mismatch for {{ item.item.item }}.
      Expected: {{ linstor_deb_checksums[item.item.item] }}, Actual: {{ item.stat.checksum }}.
  loop: "{{ linstor_deb_stats.results | default([]) }}"
  loop_control:
    label: "{{ item.item.item }}"
  when:
    - linstor_needs_package_update
    - not item.skipped | default(false)
    - item.item.item in (linstor_deb_checksums | default({}))
    - item.stat.checksum != linstor_deb_checksums[item.item.item]
  tags: [linstor, update]

- name: Unhold LINSTOR packages for update
  ansible.builtin.command:
    argv: [apt-mark, unhold, linstor-common, linstor-controller, linstor-satellite]
  register: linstor_unhold_packages_result
  changed_when: "'was not on hold' not in (linstor_unhold_packages_result.stdout | default(''))"
  failed_when: false
  when: linstor_needs_package_update
  tags: [linstor, update]

- name: Install pinned LINSTOR debs from the local cache
  ansible.builtin.apt:
    deb: "{{ linstor_cached_debs.results | default([]) | map(attribute='files') | map('first') | map(attribute='path') | join(',') }}"
    state: present
    allow_downgrade: true
  when: linstor_needs_package_update
  tags: [linstor, update]

- name: Install LINSTOR client and LVM dependencies
  ansible.builtin.apt:
    name:
      - lvm2
      - linstor-client
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [linstor, update]

- name: Hold pinned LINSTOR packages
  ansible.builtin.command:
    argv: [apt-mark, hold, linstor-common, linstor-controller, linstor-satellite]
  register: linstor_hold_packages_result
  changed_when: "'was already' not in (linstor_hold_packages_result.stdout | default(''))"
  when: linstor_hold_packages | bool
  tags: [linstor, update]

- name: Ensure LVM conf.d directory exists
  ansible.builtin.file:
    path: /etc/lvm/lvm.conf.d
    state: directory
    mode: "0755"
  tags: [linstor, update]

- name: Exclude DRBD and LINSTOR devices from LVM scans
  ansible.builtin.copy:
    dest: /etc/lvm/lvm.conf.d/90-linstor.conf
    content: |
      # Managed by Ansible (role: linstor). LVM >= 2.02.98 auto-loads conf.d/*.conf
      devices {
          global_filter = [ "r|^/dev/drbd|", "r|^/dev/mapper/[lL]instor|" ]
      }
    mode: "0644"
  notify: Restart linstor satellite
  tags: [linstor, update]

# --- DRBD kernel modules ----------------------------------------------------
- name: Install DRBD kernel module and DKMS build dependencies
  ansible.builtin.apt:
    name:
      - "linux-headers-{{ ansible_kernel }}"
      - gcc
      - make
      - drbd-dkms
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [linstor, update]

- name: Load drbd kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - drbd
    - drbd_transport_tcp
  tags: [linstor, update]

- name: Persist drbd modules across reboots
  ansible.builtin.copy:
    dest: /etc/modules-load.d/drbd.conf
    content: |
      drbd
      drbd_transport_tcp
    mode: "0644"
  tags: [linstor, update]

- name: Verify drbd kernel modules are built
  ansible.builtin.command:
    argv: [modinfo, -n, "{{ item }}"]
  register: linstor_drbd_modinfo
  changed_when: false
  failed_when: linstor_drbd_modinfo.rc != 0
  loop:
    - drbd
    - drbd_transport_tcp
  tags: [linstor, update]

- name: Create volume group for LINSTOR
  community.general.lvg:
    vg: "{{ linstor_vg }}"
    pvs:
      - "{{ linstor_block_device }}"
    state: present
  tags: [linstor, update]

- name: Create thin pool logical volume
  community.general.lvol:
    vg: "{{ linstor_vg }}"
    thinpool: "{{ linstor_thinpool_lv }}"
    size: 100%FREE
    shrink: false
    state: present
  tags: [linstor, update]

- name: Enable and start LINSTOR services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - linstor-satellite
    - linstor-controller
  tags: [linstor, update]

- name: Wait for LINSTOR controller REST API
  ansible.builtin.wait_for:
    port: 3370
    timeout: 120
  tags: [linstor, update]

- name: Check if node is already registered
  ansible.builtin.command:
    argv: [linstor, node, list]
  register: linstor_node_list_check
  changed_when: false
  tags: [linstor, update]

- name: Register node as combined controller and satellite
  ansible.builtin.command:
    argv: [linstor, node, create, "{{ linstor_node_name }}", "{{ linstor_node_ip }}", --node-type, combined]
  register: linstor_node_create
  changed_when: linstor_node_create.rc == 0
  when: linstor_node_name not in linstor_node_list_check.stdout
  tags: [linstor, update]

- name: Wait for node to report Online
  ansible.builtin.command:
    argv: [linstor, --machine-readable, node, list]
  register: linstor_node_online
  until: >-
    linstor_node_online.rc == 0
    and linstor_node_online.stdout[:1] == '['
    and (
      (linstor_node_online.stdout | from_json)[0]
      | selectattr('name', 'equalto', linstor_node_name)
      | map(attribute='connection_status')
      | list
    ) == ['ONLINE']
  retries: 24
  delay: 5
  changed_when: false
  tags: [linstor, update]

- name: Check if storage pool is already registered
  ansible.builtin.command:
    argv: [linstor, storage-pool, list]
  register: linstor_storage_pool_check
  changed_when: false
  tags: [linstor, update]

- name: Register LVM thin storage pool
  ansible.builtin.command:
    argv:
      - linstor
      - storage-pool
      - create
      - lvmthin
      - "{{ linstor_node_name }}"
      - "{{ linstor_storage_pool_name }}"
      - "{{ linstor_vg }}/{{ linstor_thinpool_lv }}"
  register: linstor_storage_pool_create
  changed_when: linstor_storage_pool_create.rc == 0
  failed_when: >-
    linstor_storage_pool_create.rc != 0
    and 'already exists' not in (linstor_storage_pool_create.stdout | default('')) ~ (linstor_storage_pool_create.stderr | default(''))
  retries: 6
  delay: 5
  until: >-
    linstor_storage_pool_create.rc == 0
    or 'already exists' in (linstor_storage_pool_create.stdout | default('')) ~ (linstor_storage_pool_create.stderr | default(''))
  when: linstor_storage_pool_name not in linstor_storage_pool_check.stdout
  tags: [linstor, update]

- name: Collect LINSTOR node list
  ansible.builtin.command:
    argv:
      - linstor
      - node
      - list
  register: linstor_nodes_verify
  changed_when: false
  tags: [linstor, update]

- name: Collect LINSTOR storage pool list
  ansible.builtin.command:
    argv:
      - linstor
      - storage-pool
      - list
  register: linstor_storage_pools_verify
  changed_when: false
  tags: [linstor, update]

- name: Collect LINSTOR resource list
  ansible.builtin.command:
    argv:
      - linstor
      - resource
      - list
  register: linstor_resources_verify
  changed_when: false
  failed_when: false
  tags: [linstor, update]

- name: Show LINSTOR cluster state
  ansible.builtin.debug:
    msg:
      - "=== linstor node list ==="
      - "{{ linstor_nodes_verify.stdout }}"
      - "=== linstor storage-pool list ==="
      - "{{ linstor_storage_pools_verify.stdout }}"
      - "=== linstor resource list ==="
      - "{{ linstor_resources_verify.stdout | default('N/A') }}"
  tags: [linstor, update]
