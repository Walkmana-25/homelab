---
# Auto Manual Generation System - third-party Helm chart shipped in the app repo.
# Source: private repo git@github.com:Walkmana-25/auto-manual-generation-system.git
# (repo credential = SealedSecret "auto-manual-repo" in the argocd namespace).
#
# All AI traffic is routed through the in-cluster LiteLLM gateway
# (http://litellm.litellm.svc.cluster.local:4000). Secrets are provided as
# SealedSecrets (see credentials.yaml) via the chart's existingSecret hooks.
#
# Images are pushed to Harbor (harbor-k3s.lapis-dev.work/apps/auto-manual-*)
# and additionally loaded into each k3s node's containerd, hence
# imagePullPolicy: IfNotPresent. The in-cluster Harbor pull credential
# (robot$k8s-pull) currently returns 401 from the registry, so a direct pull
# would fail; see the deployment notes for follow-up.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auto-manual-generation-system
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: application
  annotations:
    # Deploy after the repo credential / app secrets (sync-wave -1)
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # The API server defaults StatefulSet volumeClaimTemplates
  # (apiVersion/kind/volumeMode/status), which would otherwise leave the app
  # permanently OutOfSync.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
  source:
    repoURL: git@github.com:Walkmana-25/auto-manual-generation-system.git
    path: deploy/kubernetes/auto-manual-generation-system
    targetRevision: main
    helm:
      values: |
        # Images are built from the app repo and pushed to Harbor under the
        # immutable tag 92f02b7 (the "latest" tag points at the same digest).
        # The pull credential (registry-sealed) is the Harbor robot account
        # robot$k8s-pull with read-only access to the "apps" project.
        global:
          fullnameOverride: auto-manual
          imagePullSecrets:
            - name: regcred

        frontend:
          image:
            repository: harbor.lapis-dev.work/private/front:latest
            pullPolicy: IfNotPresent

        api:
          image:
            repository: harbor.lapis-dev.work/private/api:latest
            pullPolicy: IfNotPresent
          env:
            APP_ENV: production
            CORS_ORIGINS: '["https://manual.lapis-dev.work"]'
            # Must match api.persistence.mountPath below, otherwise uploads
            # still land on the ephemeral /tmp emptyDir.
            UPLOAD_DIR: /app/storage/uploads
            # Whisper via the in-cluster LiteLLM gateway (backed by OpenRouter
            # openai/whisper-large-v3-turbo). WHISPER_API_KEY is the LiteLLM
            # master key, provided by the sealed api-env secret. The app first
            # requests verbose_json and falls back to json, which this model
            # requires.
            WHISPER_BASE_URL: http://litellm.litellm.svc.cluster.local:4000/v1
            WHISPER_MODEL: openai/whisper-large-v3-turbo
          persistence:
            # Uploaded audio and wiki source files are persisted instead of
            # living on the ephemeral /tmp emptyDir. The chart owns the PVC
            # ("auto-manual-api-uploads") and mounts it at mountPath, which is
            # why UPLOAD_DIR above must match it.
            #
            # nfs (nfs-subdir-external-provisioner) is used because uploads are
            # shared and must survive a rolling update that surges a second API
            # pod on another node; ReadWriteMany matches what NFS actually
            # provides. The provisioner creates the export subdirectory 0777,
            # so the non-root API user (uid 10001) can write without fsGroup
            # (which Kubernetes does not apply to NFS).
            enabled: true
            storageClass: nfs
            accessModes:
              - ReadWriteMany
            size: 5Gi
            mountPath: /app/storage/uploads
          database:
            # SealedSecret with DATABASE_URL / QDRANT_URL + app config (envFrom).
            existingSecret: auto-manual-api-env

        agent:
          image:
            repository: harbor.lapis-dev.work/private/agent:latest
            pullPolicy: IfNotPresent
          env:
            OPENAI_MODEL: iniad/gpt-6-luna
          # SealedSecret with OPENAI_* (all AI via LiteLLM).
          existingSecret: auto-manual-agent-env

        postgresql:
          auth:
            # SealedSecret with POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB.
            existingSecret: auto-manual-postgres-auth
          persistence:
            storageClass: ssd

        # The agent image runs `langgraph dev` (in-memory); Redis is not needed.
        redis:
          enabled: false

        qdrant:
          persistence:
            storageClass: ssd

        ingress:
          enabled: true
          className: cloudflare-tunnel
          # TLS is terminated at the Cloudflare edge (no cert-manager issuer exists).
          hosts:
            - host: manual.lapis-dev.work
              paths:
                # The agent (langgraph dev, unauthenticated) is intentionally NOT exposed.
                - path: /api
                  pathType: Prefix
                  service: api
                - path: /
                  pathType: Prefix
                  service: frontend
  destination:
    server: https://kubernetes.default.svc
    namespace: auto-manual
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
