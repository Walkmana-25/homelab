---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: auto-manual-api-env
  namespace: auto-manual
spec:
  encryptedData:
    AGENT_URL: 
    DATABASE_URL: 
    EMBEDDING_DIMENSIONS: 
    EMBEDDING_MODEL: 
    JWT_SECRET_KEY: 
    OPENAI_API_KEY: 
    OPENAI_BASE_URL: 
    OPENAI_MODEL: 
    QDRANT_URL: 
    RAG_TOP_K: 
    WHISPER_API_KEY: 
  template:
    metadata:
      name: auto-manual-api-env
      namespace: auto-manual
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: auto-manual-agent-env
  namespace: auto-manual
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  encryptedData:
    AGENT_MODEL: 
    OPENAI_API_KEY: 
    OPENAI_BASE_URL: 
    OPENAI_MODEL: 
    POSTGRES_URI: 
  template:
    metadata:
      name: auto-manual-agent-env
      namespace: auto-manual
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: auto-manual-postgres-auth
  namespace: auto-manual
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  encryptedData:
    POSTGRES_DB: 
    POSTGRES_PASSWORD: 
    POSTGRES_USER: 
  template:
    metadata:
      name: auto-manual-postgres-auth
      namespace: auto-manual
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: registry-sealed
  namespace: auto-manual
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: 'true'
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/cluster-wide: 'true'
      name: registry-sealed
      namespace: auto-manual
    type: kubernetes.io/dockerconfigjson
