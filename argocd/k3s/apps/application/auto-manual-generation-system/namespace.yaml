---
# Created here (sync-wave -2) so the app's SealedSecrets (wave -1) and the
# child ArgoCD Application (wave 0) can be applied in the same sync.
apiVersion: v1
kind: Namespace
metadata:
  name: auto-manual
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: application
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
