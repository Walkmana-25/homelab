---
# Persistent storage for uploaded audio (UPLOAD_DIR), intended to be mounted
# into the API container once a supported mount mechanism is chosen.
#
# The upstream chart has no volume hook for the API deployment, and ArgoCD v3
# no longer supports spec.source.helm.postRenderer, so the mount is not yet
# wired up; the API currently writes to an ephemeral /tmp/uploads.
#
# ssd (LINSTOR, RWO) is used because the API runs as non-root (uid 10001) and
# needs fsGroup-based ownership, which block volumes honour. The PVC is applied
# in the same wave as the child Application: with the ssd (WaitForFirstConsumer)
# class it only binds once the API pod mounts it, so an earlier wave would
# deadlock the umbrella sync waiting on PVC health.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auto-manual-uploads
  namespace: auto-manual
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: application
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ssd
  resources:
    requests:
      storage: 5Gi
