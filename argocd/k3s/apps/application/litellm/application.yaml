---
# LiteLLM proxy (LLM gateway) - official community Helm chart
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: application
  annotations:
    # Deploy after the CloudNativePG database (litellm-postgres, sync-wave -1)
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # OCI chart (no oci:// prefix). ArgoCD appends "/<chart>" to repoURL, so the
    # artifact is pulled from ghcr.io/berriai/litellm-helm.
    repoURL: ghcr.io/berriai
    chart: litellm-helm
    targetRevision: 1.105.0
    helm:
      values: |
        replicaCount: 1

        image:
          repository: ghcr.io/berriai/litellm
          pullPolicy: IfNotPresent
          tag: "v1.105.0"

        # ── Public origin ──────────────────────────────────────
        # LiteLLM runs behind the cloudflare-tunnel ingress, which terminates
        # TLS, so the proxy pod only ever sees http. The MCP OAuth flow needs
        # the real public origin to build its own callback URL: with
        # PROXY_BASE_URL unset, LiteLLM resolves its origin from the request
        # (http://<internal-host>:4000) and tries to register
        # http://.../callback with the upstream IdP. Notion's MCP requires
        # HTTPS redirect URIs, so DCR/authorize fails. Also marks session/SSO
        # cookies Secure. Full origin only: no trailing slash, no path.
        envVars:
          PROXY_BASE_URL: https://litellm.lapis-dev.work

        # ── Credentials (SealedSecret, see credentials.yaml) ───
        # Master key + LITELLM_SALT_KEY + provider API keys
        masterkeySecretName: litellm-masterkey
        masterkeySecretKey: masterkey
        environmentSecrets:
          - litellm-env
          - litellm-mcp
          - headroom-proxy-token

        # ── Custom callback ────────────────────────────────────
        # Routing filter hook (see callbacks.yaml) that supplies
        # x-opencode-session on OpenCode Go deployments - the client's own value
        # when it sent one, a fallback otherwise. Mounted next to the config
        # file so litellm_settings.callbacks can resolve it.
        #
        # The search-mcp volume carries a hand-written OpenAPI spec (see
        # search-mcp.yaml) that mcp_servers.litellm_search turns into an MCP
        # web_search tool; see the web search note under litellm_settings.
        volumes:
          - name: callbacks
            configMap:
              name: litellm-callbacks
          - name: search-mcp
            configMap:
              name: litellm-search-mcp
        volumeMounts:
          - name: callbacks
            mountPath: /etc/litellm/callbacks
          - name: search-mcp
            mountPath: /etc/litellm/search-mcp

        # ── Resources ──────────────────────────────────────────
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi

        # ── Ingress ────────────────────────────────────────────
        # DNS record for the host is created by cloudflare-tunnel-ingress-controller
        ingress:
          enabled: true
          className: cloudflare-tunnel
          hosts:
            - host: litellm.lapis-dev.work
              paths:
                - path: /
                  pathType: Prefix

        # ── PostgreSQL (CloudNativePG via litellm-postgres) ────
        db:
          useExisting: true
          deployStandalone: false
          endpoint: litellm-postgres-rw
          database: litellm
          secret:
            name: litellm-postgres-auth
            usernameKey: username
            passwordKey: password

        # ── Redis (bundled Bitnami subchart) ───────────────────
        # Backs response caching and cross-pod coordination: with redis.enabled
        # the chart injects REDIS_HOST/REDIS_PORT/REDIS_PASSWORD and adds
        # general_settings.coordination_redis automatically.
        #
        # auth.existingSecret pins the password (the subchart's own secret would
        # be re-randomised on every ArgoCD render, since `helm template` cannot
        # run the cluster `lookup` it relies on). See credentials.yaml.
        redis:
          enabled: true
          architecture: standalone
          auth:
            enabled: true
            existingSecret: litellm-redis-auth
            existingSecretPasswordKey: redis-password
          master:
            persistence:
              enabled: true
              storageClass: ssd
              size: 2Gi
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 250m
                memory: 256Mi

        # ── LiteLLM proxy config ───────────────────────────────
        # API keys come from the litellm-env SealedSecret.
        #
        # Models are populated automatically by the litellm-model-sync CronJob
        # (see model-sync.yaml), which registers every model each provider
        # exposes as <provider>/<model> (zai/..., iniad/..., iniad-claude/...,
        # opencode-go/...). INIAD OpenAI and z.ai (GLM Coding Plan, whose OpenAI
        # Responses endpoint is api.z.ai/api/v1) models are registered with mode
        # "responses", so LiteLLM calls the provider's /responses endpoint
        # (bridging /v1/chat/completions to it). OpenCode Go is probed per model
        # and uses the Responses API wherever the model supports it; chat-only
        # models get use_chat_completions_api, so /v1/responses is bridged to
        # their /chat/completions upstream.
        #
        # No wildcard model_list entries are declared: a "provider/*" entry makes
        # LiteLLM expand the underlying provider's whole catalog (hundreds of
        # bogus zai/<openai-model> names), and that expansion is still visible to
        # the admin/master key even with model_info.discoverable=false.
        proxy_config:
          model_list: []
          # ── Headroom prompt compression ────────────────────────
          # Compresses messages through the in-cluster Headroom proxy
          # (POST /v1/compress) before the upstream LLM call. Compression is
          # opt-in: send `"guardrails": ["headroom-compression"]` in the
          # request body, or attach the guardrail to a virtual key. Set
          # default_on only after validating output quality and latency.
          guardrails:
            - guardrail_name: headroom-compression
              litellm_params:
                guardrail: headroom
                mode: pre_call
                api_base: http://headroom.headroom.svc.cluster.local:8787
                api_key: os.environ/HEADROOM_PROXY_TOKEN
                default_on: false
          # ── Web search (Tavily + Exa + self-hosted SearXNG, LB) ─
          # Three search_tools entries share the name "web_search"; LiteLLM's
          # search router load-balances / falls back across same-named tools.
          # Call it as:
          #   POST /v1/search/web_search
          #   POST /v1/search  with {"search_tool_name": "web_search"}
          # Tavily/Exa keys come from the litellm-env SealedSecret; SearXNG runs
          # in-cluster and needs no key.
          #
          # SearXNG is less reliable than the hosted providers (it aggregates
          # upstream engines), so callers should retry a failed search; the MCP
          # tool description says so (see search-mcp.yaml).
          #
          # Firecrawl is deliberately NOT part of this LB. Its /search returns
          # full-page markdown per result unless scrapeOptions says otherwise
          # (a five-result search measured ~620KB), and it rejects the bounded
          # "contents" parameter that exa needs (HTTP 400 on unknown keys). Exa's
          # default is full page text too, so the compact_search callback bounds
          # both; that only works while firecrawl is out of the LB. Firecrawl
          # stays available to MCP clients through the mcp-proxy's
          # firecrawl_search tool.
          search_tools:
            - search_tool_name: web_search
              litellm_params:
                search_provider: tavily
                api_key: os.environ/TAVILY_API_KEY
            - search_tool_name: web_search
              litellm_params:
                search_provider: exa_ai
                api_key: os.environ/EXA_API_KEY
            - search_tool_name: web_search
              litellm_params:
                search_provider: searxng
                api_base: http://searxng.searxng.svc.cluster.local:8080
          general_settings:
            master_key: os.environ/PROXY_MASTER_KEY
            store_model_in_db: true
            # Persist request/response payloads alongside each spend log so the
            # Admin UI can show them (Logs -> request/response details). Without
            # it the UI reports "Request/Response Data Not Available". Only new
            # requests are recorded; spend logs grow with traffic.
            store_prompts_in_spend_logs: true
            # ―― Spend-log retention ――
            # LiteLLM only registers the cleanup job when one of the
            # maximum_*_retention_period settings is set; otherwise logs are
            # kept forever (bounded only by the 5Gi postgres volume). Prompts
            # roughly quadruple the per-row size, so cap it at 90 days and run
            # the prune daily at 03:00.
            maximum_spend_logs_retention_period: "90d"
            maximum_spend_logs_cleanup_cron: "0 3 * * *"
            # Enable the Chat UI (Admin UI -> Chat, /ui/chat)
            enable_chat_ui: true
          litellm_settings:
            drop_params: true
            # ── Web search: provider-hosted only ───────────────────
            # Clients (Codex-class apps) send the Responses hosted tool
            # {"type": "web_search"}. It is executed by the UPSTREAM, so it only
            # works for deployments that speak the Responses API end to end:
            # every INIAD and z.ai model, and the Responses-native OpenCode Go
            # models (deepseek-*, grok-*, gpt-*-luna).
            #
            # OpenCode Go chat-only models (kimi-*, mimo-*, glm-*, qwen-*,
            # minimax-m2.5/m3, ...) are registered with use_chat_completions_api
            # (see model-sync.yaml), so /v1/responses is bridged to their
            # /chat/completions upstream. LiteLLM rewrites the hosted tool into
            # the chat web_search_options param, which the OpenCode Go chat
            # endpoint accepts but ignores - those models cannot search.
            #
            # LiteLLM's server-side replacement (litellm_settings.callbacks:
            # websearch_interception + websearch_interception_params, removed in
            # history) must NOT be re-enabled: it works for non-streaming, but a
            # stream=true /v1/responses request on a bridged model is flipped to
            # non-streaming for the agentic loop and the SSE stream is never
            # rebuilt, so every such request fails with HTTP 500
            # ("'ResponsesAPIResponse' object has no attribute '__aiter__'" -
            # LiteLLM 1.105.x, documented in the integration's ARCHITECTURE.md
            # as a limitation of the /v1/responses surface). Streaming clients
            # like the Codex app send stream=true and always carry the web_search
            # tool, so enabling it would break them; it would also replace
            # INIAD's native OpenAI web search with the proxy search_tools above.
            # Use a Responses-native model (deepseek-*, grok-*, gpt-*-luna) when
            # web search is needed.
            #
            # ── Web search over MCP ────────────────────────────────
            # The search_tools above are also exposed as an MCP tool on /mcp
            # (see mcp_servers.litellm_search and the search-mcp volume), so a
            # client that speaks MCP can run the search itself. That is the one
            # way to give a chat-only OpenCode Go model web search without the
            # streaming problem above: the model never needs a server-side tool.
            # user_url_allowed_hosts is required because the server is
            # OpenAPI-registered and calls the proxy's own service, which
            # LiteLLM's SSRF guard blocks by default.
            user_url_allowed_hosts:
              - litellm.litellm.svc.cluster.local
            # opencode_session_handler supplies x-opencode-session on OpenCode Go
            # deployments (see callbacks.yaml). It runs as a routing filter, once
            # the tier-resolved model's candidate deployments are known, and adds
            # the header only when every candidate points at OpenCode Go - so
            # retries, fallback steps and alias / auto-router tiers that land on
            # OpenCode Go are covered, while z.ai / INIAD never receive the
            # header. The client's own per-conversation id wins when it sent one;
            # the static fallback only rescues clients that send none.
            # compact_search bounds the payload of /v1/search (results above),
            # which also keeps the MCP web_search tool's response small.
            # opencode_models_handler registers OpenCode Go models with the
            # model cost map at import time (see callbacks.yaml), so the
            # auto-router's context compaction resolves tier model limits
            # instead of failing with ModelNotMappedError on large requests.
            callbacks:
              - callbacks.opencode_session.opencode_session_handler
              - callbacks.opencode_models.opencode_models_handler
              - callbacks.compact_search.compact_search_handler
            # Forward the client's x-* headers (notably x-opencode-session) for
            # requests that name an opencode-go/... model directly, so the proxy's
            # own session never replaces the client's. This is the documented
            # allowlist path and stays scoped to OpenCode Go: the list is matched
            # against the model group the client asked for, so listing alias /
            # auto-router groups here would also send client headers to whatever
            # other providers those groups can route to. Requests arriving under
            # such group names re-read the client header via proxy_server_request
            # in the routing filter hook instead (see callbacks.yaml).
            model_group_settings:
              forward_client_headers_to_llm_api:
                - opencode-go/*
          # ── MCP gateway: web search ────────────────────────────
          # Register the proxy's own /v1/search as an MCP tool, so MCP clients
          # (e.g. the Codex app) can run the query themselves and every model
          # gets web search regardless of its protocol. Clients connect to
          # https://litellm.lapis-dev.work/mcp and call the tool named
          # litellm_search-web_search with {"body": {"query": "..."}}.
          #
          # The OpenAPI spec is hand-written (search-mcp.yaml) because LiteLLM's
          # own /openapi.json does not publish /v1/search's requestBody, so
          # pointing spec_path at it yields a tool with no query argument.
          # auth_type bearer_token reuses the master key so the generated tool
          # can call the proxy; nothing secret is stored inline.
          mcp_servers:
            litellm_search:
              transport: http
              spec_path: /etc/litellm/search-mcp/openapi.json
              auth_type: bearer_token
              auth_value: os.environ/PROXY_MASTER_KEY
              description: "LiteLLM web search (Tavily/Exa/Firecrawl, load-balanced)"

  destination:
    server: https://kubernetes.default.svc
    namespace: litellm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
