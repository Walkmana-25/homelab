---
# LiteLLM proxy (LLM gateway) - official community Helm chart
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: application
  annotations:
    # Deploy after the CloudNativePG database (litellm-postgres, sync-wave -1)
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # OCI chart (no oci:// prefix). ArgoCD appends "/<chart>" to repoURL, so the
    # artifact is pulled from ghcr.io/berriai/litellm-helm.
    repoURL: ghcr.io/berriai
    chart: litellm-helm
    targetRevision: 1.105.0
    helm:
      values: |
        replicaCount: 1

        image:
          repository: ghcr.io/berriai/litellm
          pullPolicy: IfNotPresent
          tag: "v1.105.0"

        # ── Credentials (SealedSecret, see credentials.yaml) ───
        # Master key + LITELLM_SALT_KEY + provider API keys
        masterkeySecretName: litellm-masterkey
        masterkeySecretKey: masterkey
        environmentSecrets:
          - litellm-env

        # ── Resources ──────────────────────────────────────────
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi

        # ── Ingress ────────────────────────────────────────────
        # DNS record for the host is created by cloudflare-tunnel-ingress-controller
        ingress:
          enabled: true
          className: cloudflare-tunnel
          hosts:
            - host: litellm.lapis-dev.work
              paths:
                - path: /
                  pathType: Prefix

        # ── PostgreSQL (CloudNativePG via litellm-postgres) ────
        db:
          useExisting: true
          deployStandalone: false
          endpoint: litellm-postgres-rw
          database: litellm
          secret:
            name: litellm-postgres-auth
            usernameKey: username
            passwordKey: password

        # Single replica - no cross-pod coordination store required
        redis:
          enabled: false

        # ── LiteLLM proxy config ───────────────────────────────
        # Only the proxy essentials are managed here. Provider credentials
        # (ZAI_API_KEY, INIAD_API_KEY, INIAD_BASE_URL, INIAD_CLAUDE_URL) come
        # from the litellm-env SealedSecret. Models are managed from the UI
        # (store_model_in_db persists them in Postgres), so no model_list is
        # declared in Git and ArgoCD selfHeal will not remove UI-added models.
        proxy_config:
          # Explicitly empty: the chart's default values ship a sample model_list
          # (gpt-3.5-turbo/fake) which we must clear.
          model_list: []
          general_settings:
            master_key: os.environ/PROXY_MASTER_KEY
            store_model_in_db: true
          litellm_settings:
            drop_params: true

  destination:
    server: https://kubernetes.default.svc
    namespace: litellm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
