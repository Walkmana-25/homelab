---
# LiteLLM proxy (LLM gateway) - official community Helm chart
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: application
  annotations:
    # Deploy after the CloudNativePG database (litellm-postgres, sync-wave -1)
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # OCI chart (no oci:// prefix). ArgoCD appends "/<chart>" to repoURL, so the
    # artifact is pulled from ghcr.io/berriai/litellm-helm.
    repoURL: ghcr.io/berriai
    chart: litellm-helm
    targetRevision: 1.105.0
    helm:
      values: |
        replicaCount: 1

        image:
          repository: ghcr.io/berriai/litellm
          pullPolicy: IfNotPresent
          tag: "v1.105.0"

        # ── Credentials (SealedSecret, see credentials.yaml) ───
        # Master key + LITELLM_SALT_KEY + provider API keys
        masterkeySecretName: litellm-masterkey
        masterkeySecretKey: masterkey
        environmentSecrets:
          - litellm-env
          - litellm-mcp

        # ── Resources ──────────────────────────────────────────
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi

        # ── Ingress ────────────────────────────────────────────
        # DNS record for the host is created by cloudflare-tunnel-ingress-controller
        ingress:
          enabled: true
          className: cloudflare-tunnel
          hosts:
            - host: litellm.lapis-dev.work
              paths:
                - path: /
                  pathType: Prefix

        # ── PostgreSQL (CloudNativePG via litellm-postgres) ────
        db:
          useExisting: true
          deployStandalone: false
          endpoint: litellm-postgres-rw
          database: litellm
          secret:
            name: litellm-postgres-auth
            usernameKey: username
            passwordKey: password

        # Single replica - no cross-pod coordination store required
        redis:
          enabled: false

        # ── LiteLLM proxy config ───────────────────────────────
        # API keys come from the litellm-env SealedSecret.
        #
        # Models are populated automatically by the litellm-model-sync CronJob
        # (see model-sync.yaml), which registers every model each provider
        # exposes as <provider>/<model> (zai/..., iniad/..., iniad-claude/...,
        # opencode-go/...). INIAD OpenAI models are registered with mode
        # "responses", so LiteLLM calls INIAD's /responses endpoint (bridging
        # /v1/chat/completions to it). OpenCode Go is probed per model and uses
        # the Responses API wherever the model supports it.
        #
        # No wildcard model_list entries are declared: a "provider/*" entry makes
        # LiteLLM expand the underlying provider's whole catalog (hundreds of
        # bogus zai/<openai-model> names), and that expansion is still visible to
        # the admin/master key even with model_info.discoverable=false.
        proxy_config:
          model_list: []
          general_settings:
            master_key: os.environ/PROXY_MASTER_KEY
            store_model_in_db: true
            # Enable the Chat UI (Admin UI -> Chat, /ui/chat)
            enable_chat_ui: true
          litellm_settings:
            drop_params: true
            # Forward the client's x-* headers (notably x-opencode-session) to
            # OpenCode Go only, so per-conversation sessions pass through instead
            # of the proxy's static session. Scoped so z.ai / INIAD never receive
            # client headers.
            model_group_settings:
              forward_client_headers_to_llm_api:
                - opencode-go/*
          # ── MCP gateway ────────────────────────────────────────
          # Expose the homelab MCP servers (aggregated by the mcp-proxy in the
          # mcp-proxy namespace) through LiteLLM's MCP gateway. The proxy's nginx
          # sidecar requires a bearer token (MCP_PROXY_TOKEN, sealed secret
          # litellm-mcp) and strips it before forwarding upstream.
          mcp_servers:
            mcps:
              url: "http://mcp-proxy.mcp-proxy.svc.cluster.local:9090/mcp"
              transport: "http"
              auth_type: "bearer_token"
              auth_value: os.environ/MCP_PROXY_TOKEN
              description: "Homelab MCP proxy (deepwiki, searxng, firecrawl, context7)"

  destination:
    server: https://kubernetes.default.svc
    namespace: litellm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
