---
# LiteLLM proxy (LLM gateway) - official community Helm chart
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: application
  annotations:
    # Deploy after the CloudNativePG database (litellm-postgres, sync-wave -1)
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # OCI chart (no oci:// prefix). ArgoCD appends "/<chart>" to repoURL, so the
    # artifact is pulled from ghcr.io/berriai/litellm-helm.
    repoURL: ghcr.io/berriai
    chart: litellm-helm
    targetRevision: 1.105.0
    helm:
      values: |
        replicaCount: 1

        image:
          repository: ghcr.io/berriai/litellm
          pullPolicy: IfNotPresent
          tag: "v1.105.0"

        # ── Credentials (SealedSecret, see credentials.yaml) ───
        # Master key + LITELLM_SALT_KEY + provider API keys
        masterkeySecretName: litellm-masterkey
        masterkeySecretKey: masterkey
        environmentSecrets:
          - litellm-env

        # ── Resources ──────────────────────────────────────────
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi

        # ── Ingress ────────────────────────────────────────────
        # DNS record for the host is created by cloudflare-tunnel-ingress-controller
        ingress:
          enabled: true
          className: cloudflare-tunnel
          hosts:
            - host: litellm.lapis-dev.work
              paths:
                - path: /
                  pathType: Prefix

        # ── PostgreSQL (CloudNativePG via litellm-postgres) ────
        db:
          useExisting: true
          deployStandalone: false
          endpoint: litellm-postgres-rw
          database: litellm
          secret:
            name: litellm-postgres-auth
            usernameKey: username
            passwordKey: password

        # Single replica - no cross-pod coordination store required
        redis:
          enabled: false

        # ── LiteLLM proxy config ───────────────────────────────
        # API keys come from the litellm-env SealedSecret.
        #
        # Wildcard entries make every model under a provider callable by name as
        # <provider>/<model>. The concrete model list shown in /v1/models and the
        # admin UI is populated automatically by the litellm-model-sync CronJob
        # (see model-sync.yaml), because LiteLLM's built-in discovery cannot
        # follow these providers' custom /models paths.
        proxy_config:
          model_list:
            # z.ai (OpenAI-compatible)
            - model_name: "zai/*"
              litellm_params:
                model: "openai/*"
                api_base: "https://api.z.ai/api/coding/paas/v4"
                api_key: os.environ/ZAI_API_KEY
            # INIAD OpenAI (OpenAI-compatible)
            - model_name: "iniad/*"
              litellm_params:
                model: "openai/*"
                api_base: "https://api.openai.iniad.org/api/v1"
                api_key: os.environ/INIAD_API_KEY
            # INIAD Claude (Anthropic-native; api_base must omit /v1 because
            # LiteLLM appends /v1/messages)
            - model_name: "iniad-claude/*"
              litellm_params:
                model: "anthropic/*"
                api_base: "https://api.anthropic.iniad.org/api"
                api_key: os.environ/INIAD_API_KEY
          general_settings:
            master_key: os.environ/PROXY_MASTER_KEY
            store_model_in_db: true
          litellm_settings:
            drop_params: true

  destination:
    server: https://kubernetes.default.svc
    namespace: litellm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
