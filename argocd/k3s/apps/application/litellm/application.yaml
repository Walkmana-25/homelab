---
# LiteLLM proxy (LLM gateway) - official community Helm chart
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: application
  annotations:
    # Deploy after the CloudNativePG database (litellm-postgres, sync-wave -1)
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # OCI chart (no oci:// prefix). ArgoCD appends "/<chart>" to repoURL, so the
    # artifact is pulled from ghcr.io/berriai/litellm-helm.
    repoURL: ghcr.io/berriai
    chart: litellm-helm
    targetRevision: 1.105.0
    helm:
      values: |
        replicaCount: 1

        image:
          repository: ghcr.io/berriai/litellm
          pullPolicy: IfNotPresent
          tag: "v1.105.0"

        # ── Credentials (SealedSecret, see credentials.yaml) ───
        # Master key + LITELLM_SALT_KEY + provider API keys
        masterkeySecretName: litellm-masterkey
        masterkeySecretKey: masterkey
        environmentSecrets:
          - litellm-env

        # ── Resources ──────────────────────────────────────────
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi

        # ── Ingress ────────────────────────────────────────────
        # DNS record for the host is created by cloudflare-tunnel-ingress-controller
        ingress:
          enabled: true
          className: cloudflare-tunnel
          hosts:
            - host: litellm.lapis-dev.work
              paths:
                - path: /
                  pathType: Prefix

        # ── PostgreSQL (CloudNativePG via litellm-postgres) ────
        db:
          useExisting: true
          deployStandalone: false
          endpoint: litellm-postgres-rw
          database: litellm
          secret:
            name: litellm-postgres-auth
            usernameKey: username
            passwordKey: password

        # Single replica - no cross-pod coordination store required
        redis:
          enabled: false

        # ── LiteLLM proxy config ───────────────────────────────
        proxy_config:
          general_settings:
            master_key: os.environ/PROXY_MASTER_KEY
          litellm_settings:
            drop_params: true
          model_list:
            # ── z.ai (OpenAI-compatible) ──────────────────────
            - model_name: glm-5.1
              litellm_params:
                model: openai/glm-5.1
                api_base: https://api.z.ai/api/coding/paas/v4
                api_key: os.environ/ZAI_API_KEY
            - model_name: glm-5
              litellm_params:
                model: openai/glm-5
                api_base: https://api.z.ai/api/coding/paas/v4
                api_key: os.environ/ZAI_API_KEY
            - model_name: glm-5-turbo
              litellm_params:
                model: openai/glm-5-turbo
                api_base: https://api.z.ai/api/coding/paas/v4
                api_key: os.environ/ZAI_API_KEY
            - model_name: glm-4.7
              litellm_params:
                model: openai/glm-4.7
                api_base: https://api.z.ai/api/coding/paas/v4
                api_key: os.environ/ZAI_API_KEY
            - model_name: glm-4.6v
              litellm_params:
                model: openai/glm-4.6v
                api_base: https://api.z.ai/api/coding/paas/v4
                api_key: os.environ/ZAI_API_KEY
            - model_name: glm-4.5-air
              litellm_params:
                model: openai/glm-4.5-air
                api_base: https://api.z.ai/api/coding/paas/v4
                api_key: os.environ/ZAI_API_KEY
            # ── INIAD OpenAI (OpenAI-compatible) ──────────────
            - model_name: gpt-5.4-mini
              litellm_params:
                model: openai/gpt-5.4-mini
                api_base: os.environ/INIAD_BASE_URL
                api_key: os.environ/INIAD_API_KEY
            # ── INIAD Claude (Anthropic-native API: /v1/messages) ──
            - model_name: claude-sonnet-4-6
              litellm_params:
                model: anthropic/claude-sonnet-4-6
                api_base: os.environ/INIAD_CLAUDE_URL
                api_key: os.environ/INIAD_API_KEY

  destination:
    server: https://kubernetes.default.svc
    namespace: litellm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
