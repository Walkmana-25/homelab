---
# Custom LiteLLM callbacks, loaded via litellm_settings.callbacks in
# application.yaml, which resolves "callbacks.<module>.<handler>" against the
# config file's directory (/etc/litellm/config.yaml -> /etc/litellm/callbacks/).
#
# - opencode_session.py: x-opencode-session on OpenCode Go deployments only
#   (chosen by destination, client value preferred over a static fallback).
# - opencode_models.py: mirror the gateway deployments' (OpenCode Go, z.ai,
#   INIAD) context limits into LiteLLM's model cost map (pre-call, read off the
#   router) so the auto-router's context compaction can resolve them.
# - compact_search.py: bound the payload of provider-hosted search results.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-callbacks
  namespace: litellm
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: application
data:
  compact_search.py: |
    from litellm.integrations.custom_logger import CustomLogger

    # Characters of page text kept per search result. LiteLLM asks the search
    # providers for full content by default, which for a five-result search can
    # reach hundreds of KB and floods the caller's context.
    BOUNDED_TEXT_CHARS = 800


    class CompactSearchParams(CustomLogger):
        """Bound the payload of /v1/search responses.

        LiteLLM's firecrawl search requests full-page markdown and its exa
        search requests full page text unless the request says otherwise, so a
        single search response can reach hundreds of KB. This pre-call hook
        injects bounded defaults when the caller did not ask for more; a caller
        that passes its own scrapeOptions/contents keeps them.

        scrapeOptions is accepted (and ignored) by every provider we register;
        contents is not - firecrawl rejects unknown keys with HTTP 400 - so
        contents must only be used while firecrawl is absent from the
        web_search load balancer (see search_tools in application.yaml).
        """

        async def async_pre_call_hook(self, user_api_key_dict, cache, data, call_type):
            if call_type not in ("search", "asearch") or not isinstance(data, dict):
                return data
            data.setdefault("scrapeOptions", {"formats": []})
            data.setdefault("contents", {"text": {"maxCharacters": BOUNDED_TEXT_CHARS}})
            data.setdefault("max_results", 5)
            return data


    compact_search_handler = CompactSearchParams()
  opencode_session.py: |
    from urllib.parse import urlparse

    from litellm.integrations.custom_logger import CustomLogger

    # OpenCode Go refuses requests that carry no session id (HTTP 400
    # MissingSessionID), and uses that id for its own routing and prompt
    # caching - so a per-conversation value is what should reach it, not one
    # shared constant.
    #
    # The destination is only known once a deployment has been selected. The
    # routing filter hook (async_filter_deployments) sees all candidates at
    # once, but request_kwargs["headers"] applies to the whole request: adding
    # the header there would also send it to z.ai / INIAD when a routing group
    # mixes providers. The previous all-or-nothing guard avoided that leak by
    # skipping the header whenever any candidate was not OpenCode Go - which
    # broke mixed priority groups such as routing/glm-5.3, where z.ai is tried
    # first and OpenCode Go is the fallback. The OpenCode fallback then failed
    # with "Request is missing x-opencode-session".
    #
    # The per-deployment pre-call hook runs once per selected attempt, including
    # chat, Responses, retries and fallbacks. It is invoked by the async wrapper
    # around litellm.acompletion / litellm.aresponses; setting "extra_headers"
    # there reaches both API surfaces (the chat path merges it into "headers",
    # while the Responses path forwards it as the handler's extra_headers).
    # Because it runs only for the selected deployment, the header is never sent
    # to z.ai / INIAD. A client-supplied value is always preferred; the static
    # fallback only rescues clients that send none.
    SESSION_HEADER = "x-opencode-session"
    OPENCODE_HOST = "opencode.ai"
    FALLBACK_SESSION = "litellm-fallback"


    def _header_value(headers, name):
        if not isinstance(headers, dict):
            return None
        for key, value in headers.items():
            if str(key).lower() == name:
                return value
        return None


    def _is_opencode_api_base(api_base):
        host = (urlparse(str(api_base or "")).hostname or "").lower()
        return host == OPENCODE_HOST or host.endswith("." + OPENCODE_HOST)


    def _api_base(kwargs):
        api_base = kwargs.get("api_base")
        if api_base:
            return api_base
        litellm_params = kwargs.get("litellm_params")
        if isinstance(litellm_params, dict):
            return litellm_params.get("api_base")
        return getattr(litellm_params, "api_base", None)


    def _session_id(kwargs):
        for key in ("extra_headers", "headers"):
            value = _header_value(kwargs.get(key), SESSION_HEADER)
            if value is not None:
                return value
        proxy_request = kwargs.get("proxy_server_request")
        client_headers = proxy_request.get("headers") if isinstance(proxy_request, dict) else None
        return _header_value(client_headers, SESSION_HEADER)


    class OpenCodeSessionFallback(CustomLogger):
        async def async_pre_call_deployment_hook(self, kwargs, call_type):
            if not _is_opencode_api_base(_api_base(kwargs)):
                return None

            session_id = _session_id(kwargs) or FALLBACK_SESSION
            extra_headers = kwargs.get("extra_headers")
            extra_headers = dict(extra_headers) if isinstance(extra_headers, dict) else {}
            if _header_value(extra_headers, SESSION_HEADER) is None:
                extra_headers[SESSION_HEADER] = session_id
            kwargs["extra_headers"] = extra_headers
            return kwargs


    opencode_session_handler = OpenCodeSessionFallback()
  opencode_models.py: |
    import litellm
    from urllib.parse import urlparse

    from litellm.integrations.custom_logger import CustomLogger

    # The complexity auto-router's context compaction resolves the tier model's
    # context window through litellm.get_model_info(), which only consults the
    # built-in model cost map. Every gateway deployment this proxy registers by
    # hand - OpenCode Go, z.ai and INIAD - uses a generic adapter
    # (litellm_params.model = "openai/mimo-v2.6-pro",
    # "openai/responses/deepseek-v4.1-flash", "anthropic/minimax-m2.7", ...) and
    # those keys are not in the map. Responses deployments are spelled
    # "openai/responses/<id>" (see model-sync.yaml), a form the built-in map does
    # not carry at all - which is why a MEDIUM auto-router request that resolved
    # to a z.ai tier failed with ModelNotMappedError (HTTP 500) and fell back to
    # deepseek before reaching the upstream. Small requests skip compaction,
    # which is why the failure only showed up under real agent workloads.
    #
    # Gateway models whose vendor has a built-in cost-map entry of its own are
    # spelled "<adapter>/<vendor>/<id>" instead ("openai/zai/glm-5.3-flash"), so
    # the model string names the vendor and corresponds to that entry
    # ("zai/glm-5.3-flash") rather than an id the map does not know. LiteLLM
    # resolves cost-map keys from the first segment, so it does not resolve the
    # nested key natively. This callback therefore (i) registers the deployment
    # key with the vendor's cost rates copied from the built-in "<vendor>/<id>"
    # entry, and (ii) strips the vendor segment again on the way out, because
    # OpenCode Go accepts only the bare model id and answers "zai/glm-5.3-flash"
    # with HTTP 400 "Model is unavailable". The strip is gated on the OpenCode
    # api_base, so z.ai / INIAD keep their model strings untouched.
    #
    # OpencodeModelRegistration.async_pre_call_hook registers every gateway
    # deployment under its own model string, from the deployment's own model_info:
    # the model-sync CronJob keeps max_input_tokens/max_output_tokens there (see
    # model-sync.yaml), so nothing is transcribed by hand, a new model needs no
    # edit here, and a re-windowed model is corrected on the next request. Pre-call
    # runs before routing, so the compaction budget that follows always finds its
    # key. Entries this callback registered are refreshed; built-in cost-map
    # entries are never overwritten, and a deployment that carries neither limits
    # nor a vendor rate entry is left alone rather than given a synthetic entry.
    #
    # The module and class names are historical: they predate z.ai / INIAD
    # support and stay because application.yaml references the handler by name.
    #
    # The entry deliberately carries no "mode". A cost-map entry with one stops
    # litellm.main.responses_api_bridge_check from normalizing the "responses/"
    # bridge prefix (it only strips the prefix while the entry's mode is unset),
    # so a registered "mode": "chat" on an "openai/responses/<id>" key makes the
    # proxy send model="responses/<id>" to the chat endpoint. Leaving mode unset
    # keeps prefixed and unprefixed keys behaving exactly as they did while
    # unregistered.
    # Adapters used by the OpenAI-compatible gateways this proxy registers by
    # hand (OpenCode Go, z.ai, INIAD). azure/bedrock are excluded: their
    # litellm_params.model is a deployment name, not a cost-map key. A model
    # whose vendor has a built-in entry is spelled "<adapter>/<vendor>/<id>"
    # ("openai/zai/glm-5.3-flash"), or "<adapter>/responses/<vendor>/<id>"
    # ("openai/responses/zai/glm-5.3-flash") for the Responses bridge.
    GATEWAY_PREFIXES = ("openai/", "anthropic/")

    # OpenCode Go's host. Only requests that go there get the vendor segment
    # stripped (see _strip_vendor): the gateway knows its models by bare id.
    OPENCODE_HOST = "opencode.ai"


    # Keys this callback put in the cost map, so only those get refreshed and no
    # built-in entry is shadowed.
    _registered_keys: set = set()


    def _positive_int(value) -> bool:
        return isinstance(value, int) and not isinstance(value, bool) and value > 0


    def _as_dict(value) -> dict:
        """A deployment's model_info / litellm_params as a plain dict."""
        if isinstance(value, dict):
            return value
        dump = getattr(value, "model_dump", None)
        return dump() if callable(dump) else {}


    def _is_opencode_api_base(api_base) -> bool:
        host = (urlparse(str(api_base or "")).hostname or "").lower()
        return host == OPENCODE_HOST or host.endswith("." + OPENCODE_HOST)


    def _api_base(kwargs):
        api_base = kwargs.get("api_base")
        if api_base:
            return api_base
        litellm_params = kwargs.get("litellm_params")
        if isinstance(litellm_params, dict):
            return litellm_params.get("api_base")
        return getattr(litellm_params, "api_base", None)


    def _limit_entry(model_info: dict):
        """The cost-map limits for one deployment, or None when it has none yet."""
        window = model_info.get("max_input_tokens")
        if not _positive_int(window):
            return None
        entry = {"max_input_tokens": window}
        output = model_info.get("max_output_tokens")
        if _positive_int(output):
            # max_tokens is LiteLLM's default output allowance; the deployments
            # only carry max_output_tokens, so mirror it.
            entry["max_output_tokens"] = output
            entry["max_tokens"] = output
        return entry


    def _vendor_key(model):
        """The built-in cost-map key this gateway model aliases, or None.

        Gateway deployments are spelled "<adapter>/<vendor>/<id>" (or
        "<adapter>/responses/<vendor>/<id>") so the model string names the model's
        vendor. LiteLLM resolves cost-map keys from the first segment, so the
        nested key is not built in; the vendor's own entry (e.g.
        "zai/glm-5.3-flash") is the authority for its rates.
        """
        if not isinstance(model, str) or not model.startswith("openai/"):
            return None
        rest = model[len("openai/"):]
        if rest.startswith("responses/"):
            rest = rest[len("responses/"):]
        if "/" not in rest:
            return None
        vendor, remainder = rest.split("/", 1)
        key = f"{vendor}/{remainder}"
        return key if key in litellm.model_cost else None


    def _deployment_entry(model, model_info):
        """Cost-map entry for one deployment: its limits plus the vendor's rates."""
        entry = _limit_entry(model_info) or {}
        key = _vendor_key(model)
        if key is not None:
            for name, value in (litellm.model_cost.get(key) or {}).items():
                if "cost" in name and value is not None:
                    entry.setdefault(name, value)
        return entry or None


    def _strip_vendor(model):
        """Drop the vendor segment before the upstream call.

        The vendor is part of the LiteLLM model string and its cost-map alias, but
        the gateway's own model ids are unprefixed. Handles the full deployment
        string and the intermediate forms the Responses bridge builds. Anthropic
        deployments are left alone: their adapter model is already the bare id
        (and a provider-named built-in key such as "anthropic/claude-..." must
        not be mistaken for a vendor segment). The prefixes are ordered longest
        first so "openai/responses/" is matched before "openai/".
        """
        if not isinstance(model, str) or model.startswith("anthropic/"):
            return model
        for prefix in ("openai/responses/", "openai/", "responses/", ""):
            if not model.startswith(prefix):
                continue
            tail = model[len(prefix):]
            if "/" not in tail:
                return model
            vendor, remainder = tail.split("/", 1)
            if f"{vendor}/{remainder}" in litellm.model_cost:
                return prefix + remainder
            return model
        return model


    def _entry_current(entry: dict, current: dict) -> bool:
        """True when the cost map already carries everything the entry would set."""
        return all(current.get(field) == value for field, value in entry.items())


    def register_from_router() -> None:
        """Register every gateway deployment under its own model string.

        Failures are swallowed by the caller: a skipped registration only costs
        the compaction budget, while an exception would fail the request.
        """
        from litellm.proxy import proxy_server

        router = getattr(proxy_server, "llm_router", None)
        if router is None:
            return
        for deployment in getattr(router, "model_list", None) or ():
            if not isinstance(deployment, dict):
                continue
            params = _as_dict(deployment.get("litellm_params"))
            model = params.get("model")
            if not isinstance(model, str) or not model.startswith(GATEWAY_PREFIXES):
                continue
            entry = _deployment_entry(model, _as_dict(deployment.get("model_info")))
            if entry is None:
                continue
            # The Responses bridge also looks the key up without its "responses/"
            # segment (Router._backend_cost_map_keys), so register both.
            keys = [model]
            if model.startswith("openai/responses/"):
                keys.append("openai/" + model[len("openai/responses/"):])
            for key in keys:
                current = litellm.model_cost.get(key)
                if current is not None:
                    if current.get("litellm_provider") and key not in _registered_keys:
                        # A built-in entry (or another callback's) stays authoritative.
                        # Router-created stubs carry no litellm_provider, so they can
                        # be filled with the deployment's limits and the vendor rates.
                        continue
                    if key in _registered_keys and _entry_current(entry, current):
                        continue
                litellm.register_model(model_cost={key: entry})
                _registered_keys.add(key)


    class OpencodeModelRegistration(CustomLogger):
        """Register every gateway deployment with the cost map before routing.

        Also strips the vendor segment ("openai/zai/glm-5.3-flash" ->
        "openai/glm-5.3-flash") for OpenCode Go requests, which accept only the
        bare model id. Covers OpenCode Go, z.ai and INIAD alike; the class name is
        historical (see the module comment). See the module comment for why this
        is a pre-call hook over the router's deployments rather than an
        import-time table: the table could only cover models that were
        transcribed by hand, and copying a deployment's "mode" into the cost map
        breaks the Responses bridge.
        """

        async def async_pre_call_hook(self, user_api_key_dict, cache, data, call_type):
            try:
                register_from_router()
            except Exception as error:  # noqa: BLE001
                print(f"opencode_models: cost-map registration skipped: {error}", flush=True)
            return data

        async def async_pre_call_deployment_hook(self, kwargs, call_type):
            if not _is_opencode_api_base(_api_base(kwargs)):
                return None
            model = kwargs.get("model")
            stripped = _strip_vendor(model)
            if stripped != model:
                kwargs["model"] = stripped
                return kwargs
            return None


    opencode_models_handler = OpencodeModelRegistration()
