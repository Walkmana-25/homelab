---
# Credentials for LiteLLM (Sealed Secrets - safe to commit).
#
#   litellm-masterkey      -> PROXY_MASTER_KEY (proxy admin key)
#   litellm-env            -> LITELLM_SALT_KEY + provider API keys
#   litellm-postgres-auth  -> CloudNativePG bootstrap (username/password)
#
# Regenerate a value: create a plaintext Secret in /tmp and run
#   kubeseal --format yaml < secret.yaml > credentials.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: litellm-masterkey
  namespace: litellm
spec:
  encryptedData:
    masterkey: 
  template:
    metadata:
      name: litellm-masterkey
      namespace: litellm
      labels:
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/part-of: application
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: litellm-env
  namespace: litellm
spec:
  encryptedData:
    OPENCODE_API_KEY: 
    INIAD_API_KEY: 
    INIAD_BASE_URL: 
    INIAD_CLAUDE_URL: 
    LITELLM_SALT_KEY: 
    ZAI_API_KEY: 
    TAVILY_API_KEY: 
    EXA_API_KEY: 
  template:
    metadata:
      name: litellm-env
      namespace: litellm
      labels:
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/part-of: application
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: litellm-postgres-auth
  namespace: litellm
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      name: litellm-postgres-auth
      namespace: litellm
      labels:
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/part-of: application
    type: kubernetes.io/basic-auth
---
# Bearer token for the aggregated mcp-proxy (namespace mcp-proxy)
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: litellm-mcp
  namespace: litellm
spec:
  encryptedData:
    MCP_PROXY_TOKEN: 
  template:
    metadata:
      name: litellm-mcp
      namespace: litellm
      labels:
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/part-of: application
