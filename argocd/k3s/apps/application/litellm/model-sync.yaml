---
# Keeps LiteLLM's model list in sync with the providers' /models endpoints.
#
# LiteLLM's built-in "model discovery" (wildcard model_list + check_provider_endpoint)
# cannot discover z.ai / INIAD / OpenCode Go because it hardcodes <host>/v1/models and
# ignores the api_base path (z.ai uses /api/coding/paas/v4/models, INIAD /api/v1/models,
# OpenCode Go /inference/go/v1/models). This CronJob does the same job from outside: it
# fetches each provider's /models and registers every model with the LiteLLM management
# API as <provider>/<model>, so the models show up in /v1/models and the admin UI
# (persisted via store_model_in_db).
#
# Model cost is registered alongside the deployment. LiteLLM's built-in cost map
# only knows public model names, so gateway-specific ids (glm-4.6, deepseek-v4.1-flash,
# kimi-k3, ...) would otherwise be billed at $0. Instead the job pulls per-model
# pricing from models.dev (USD per 1M tokens) and writes it into the deployment's
# litellm_params as LiteLLM's per-token fields (/model/info drops pricing sent via
# model_info, so litellm_params is the field that persists). A small explicit
# override table (/scripts/costs.json) wins over models.dev and fills the gaps it
# does not cover. INIAD is left unpriced (its endpoint is not in models.dev).
#
# Each provider declares the LiteLLM model "mode". INIAD's OpenAI endpoint is called
# through the Responses API (/api/v1/responses), so its models use mode "responses":
# LiteLLM forwards /v1/responses straight to that endpoint and bridges
# /v1/chat/completions to it as well. z.ai (GLM Coding Plan) exposes an OpenAI
# Responses endpoint at api.z.ai/api/v1 that accepts every coding-plan model, so its
# models use mode "responses" too; discovery stays on the coding /models list because
# the Responses /models only lists a few Codex models.
#
# OpenCode Go is a multi-protocol gateway: some models speak the Responses API, some
# only chat completions and a few only the Anthropic Messages API. Its mode is "auto",
# so the protocol is probed per model (Responses API preferred). Models that only
# speak chat completions get use_chat_completions_api, so a /v1/responses request is
# bridged to their /chat/completions upstream. The gateway requires an
# x-opencode-session header; the proxy supplies the client's own per deployment
# (see callbacks.yaml and model_group_settings in application.yaml) rather than
# pinning a static one.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-model-sync
  namespace: litellm
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: application
data:
  sync.py: |
    import json
    import os
    import urllib.error
    import urllib.request

    PROXY = os.environ.get("LITELLM_URL", "http://litellm:4000")
    MASTER_KEY = os.environ["LITELLM_MASTER_KEY"]

    # Each provider: the public model prefix, the LiteLLM adapter used to call it,
    # the api_base for chat, the /models listing URL (None when unsupported), the
    # env var holding the API key, the LiteLLM model "mode" and the models.dev
    # provider key used to look up per-model pricing ("pricing_provider").
    #
    # "mode" is a fixed protocol ("chat" / "responses") or "auto": with "auto" the
    # protocol is probed per model, preferring the Responses API (see deployment_for).
    PROVIDERS = [
        {
            # GLM Coding Plan. Its OpenAI Responses endpoint (api.z.ai/api/v1)
            # accepts every coding-plan model, so they are called through the
            # Responses API (chat completions is bridged to it). Discovery stays
            # on the coding /models list, which lists the full set - the
            # Responses /models endpoint only exposes a few Codex models.
            "prefix": "zai",
            "provider": "openai",
            "api_base": "https://api.z.ai/api/v1",
            "models_url": "https://api.z.ai/api/coding/paas/v4/models",
            "key_env": "ZAI_API_KEY",
            "mode": "responses",
            "pricing_provider": "zai",
        },
        {
            "prefix": "iniad",
            "provider": "openai",
            "api_base": "https://api.openai.iniad.org/api/v1",
            "models_url": "https://api.openai.iniad.org/api/v1/models",
            "key_env": "INIAD_API_KEY",
            # Call INIAD's OpenAI models through the Responses API.
            "mode": "responses",
        },
        {
            # INIAD Claude is Anthropic-native and has no /models endpoint, so its
            # models are not listed here; call them as iniad-claude/<model>.
            "prefix": "iniad-claude",
            "provider": "anthropic",
            "api_base": "https://api.anthropic.iniad.org/api",
            "models_url": None,
            "key_env": "INIAD_API_KEY",
            "mode": "chat",
        },
        {
            # OpenCode Go. Multi-protocol gateway, probed per model. The gateway
            # requires an x-opencode-session header; the proxy supplies it per
            # deployment attempt, preferring the client's own value (see
            # callbacks.yaml and model_group_settings in application.yaml), so no
            # static extra_headers are set here - extra_headers would outrank the
            # header the hook sets and shadow the client value. sync_version
            # forces a recreate whenever the deployment shape changes (v3:
            # Responses models carry the "responses/" prefix so chat requests
            # bridge to /responses).
            #
            # The probed protocol also decides web search: a client's hosted
            # Responses web_search tool reaches the upstream only for the
            # models that probe as "responses" here; chat-only models are
            # bridged, which downgrades the tool to the ignored chat
            # web_search_options param. See the web search note in
            # application.yaml before changing this.
            "prefix": "opencode-go",
            "api_base": "https://opencode.ai/inference/go/v1",
            "models_url": "https://opencode.ai/inference/go/v1/models",
            "key_env": "OPENCODE_API_KEY",
            "mode": "auto",
            "pricing_provider": "opencode-go",
            "session_header": "x-opencode-session",
            "anthropic_api_base": "https://opencode.ai/inference/go",
            # Cloudflare in front of the gateway rejects the stock Python urllib
            # user agent, so identify as a coding agent.
            "user_agent": "litellm-model-sync/1.0",
            "sync_version": 3,
        },
    ]

    # models.dev publishes per-model pricing for the providers we proxy, keyed by
    # provider and model id. Values are USD per 1M tokens. Fetched once per run;
    # on failure the run degrades to overrides-only rather than dropping prices.
    PRICE_URL = "https://models.dev/api.json"
    COSTS_PATH = "/scripts/costs.json"

    # model_info fields written for drift detection. Only the reliably-echoed
    # subset is compared, so pricing we set but LiteLLM does not read back (cache
    # rates, long-context tiers) never triggers a recreate loop.
    COST_SIGNATURE = ("input_cost_per_token", "output_cost_per_token", "base_model")


    def proxy_request(path, method="GET", payload=None):
        data = json.dumps(payload).encode() if payload is not None else None
        request = urllib.request.Request(
            PROXY + path,
            data=data,
            method=method,
            headers={
                "Authorization": "Bearer " + MASTER_KEY,
                "Content-Type": "application/json",
            },
        )
        with urllib.request.urlopen(request, timeout=60) as response:
            body = response.read().decode()
        return json.loads(body) if body else {}


    def auth_headers(provider):
        headers = {"Authorization": "Bearer " + os.environ[provider["key_env"]]}
        if provider.get("user_agent"):
            headers["User-Agent"] = provider["user_agent"]
        return headers


    def discover_models(provider):
        if not provider["models_url"]:
            return []
        request = urllib.request.Request(
            provider["models_url"],
            headers=auth_headers(provider),
        )
        with urllib.request.urlopen(request, timeout=60) as response:
            return [m["id"] for m in json.loads(response.read().decode()).get("data", [])]


    def provider_request(provider, path, payload, session):
        """POST to a provider; True on success, False if the protocol is unsupported."""
        request = urllib.request.Request(
            provider["api_base"] + path,
            data=json.dumps(payload).encode(),
            method="POST",
            headers={
                **auth_headers(provider),
                "Content-Type": "application/json",
                provider["session_header"]: session,
            },
        )
        try:
            with urllib.request.urlopen(request, timeout=60) as response:
                body = response.read().decode(errors="replace")
        except urllib.error.HTTPError as error:
            if "ModelProtocolUnsupported" in error.read().decode():
                return False
            raise
        # Some gateways answer 200 with a protocol-unsupported error body.
        return "ModelProtocolUnsupported" not in body


    def litellm_model_name(provider_name, model_id, mode):
        """LiteLLM model string for one deployment.

        Responses-API deployments carry an explicit "responses/" segment. LiteLLM
        selects the /chat/completions -> /responses bridge from the model name
        (its cost-map entry, or that prefix), never from model_info.mode. A custom
        id such as gpt-6-luna has no cost-map entry, so without the prefix chat
        requests are sent to /chat/completions and the gateway rejects them with
        "Model does not support this protocol".
        """
        if mode == "responses":
            return f"{provider_name}/responses/{model_id}"
        return f"{provider_name}/{model_id}"


    def deployment_for(provider, model_id, session):
        """(litellm_model, api_base, mode) for one model, probing when mode is auto."""
        mode = provider.get("mode", "chat")
        if mode != "auto":
            return litellm_model_name(provider["provider"], model_id, mode), provider["api_base"], mode

        # Prefer the Responses API, then chat completions, then Anthropic Messages.
        if provider_request(
            provider, "/responses",
            {"model": model_id, "input": "ping", "max_output_tokens": 16}, session,
        ):
            return litellm_model_name("openai", model_id, "responses"), provider["api_base"], "responses"
        if provider_request(
            provider, "/chat/completions",
            {"model": model_id, "messages": [{"role": "user", "content": "ping"}], "max_tokens": 16}, session,
        ):
            return litellm_model_name("openai", model_id, "chat"), provider["api_base"], "chat"
        anthropic = {**provider, "api_base": provider["anthropic_api_base"]}
        if provider_request(
            anthropic, "/v1/messages",
            {"model": model_id, "max_tokens": 16, "messages": [{"role": "user", "content": "ping"}]}, session,
        ):
            return litellm_model_name("anthropic", model_id, "chat"), provider["anthropic_api_base"], "chat"
        raise RuntimeError("no supported protocol")


    def wants_bridge(provider, mode, current):
        """True when /v1/responses must be bridged to the upstream chat endpoint.

        Only openai-compatible upstreams that speak just chat completions need the
        bridge (LiteLLM already bridges Anthropic-native deployments). A fixed-mode
        provider knows its adapter and protocol; for "auto" they are read off the
        existing deployment, which records the probed model string and protocol.
        """
        if mode != "auto":
            return provider["provider"] == "openai" and mode == "chat"
        if not current:
            return False
        return str(current["model"]).startswith("openai/") and current["mode"] == "chat"


    def fetch_prices():
        """{prefix: {model_id: cost}} from models.dev, or None when unreachable."""
        request = urllib.request.Request(
            PRICE_URL,
            headers={"User-Agent": "litellm-model-sync/1.0"},
        )
        try:
            with urllib.request.urlopen(request, timeout=60) as response:
                catalog = json.loads(response.read().decode())
        except Exception as error:  # noqa: BLE001
            print(f"price catalog unavailable (models.dev): {error}", flush=True)
            return None
        prices = {}
        for provider in PROVIDERS:
            key = provider.get("pricing_provider")
            models = (catalog.get(key) or {}).get("models") if key else None
            if models:
                prices[provider["prefix"]] = {
                    model_id: (entry.get("cost") or {})
                    for model_id, entry in models.items()
                }
        return prices


    def load_overrides():
        """Explicit per-model pricing keyed by <prefix>/<model_id> (see costs.json)."""
        try:
            with open(COSTS_PATH) as handle:
                return json.load(handle)
        except FileNotFoundError:
            return {}
        except Exception as error:  # noqa: BLE001
            print(f"costs.json ignored: {error}", flush=True)
            return {}


    def cost_fields(provider, model_id, prices, overrides, prices_ok):
        """model_info pricing for one model, or None when pricing is unknown.

        Returns a dict of LiteLLM per-token fields (1M-token rates divided down).
        None means "no data": the deployment is created/kept without pricing
        rather than having a previous price stripped off.
        """
        name = f"{provider['prefix']}/{model_id}"
        entry = overrides.get(name)
        if entry is None:
            if not prices_ok:
                return None
            entry = (prices.get(provider["prefix"]) or {}).get(model_id)
        if not entry:
            return None

        fields = {}
        for source, target in (
            ("input", "input_cost_per_token"),
            ("output", "output_cost_per_token"),
            ("cache_read", "cache_read_input_token_cost"),
            ("cache_write", "cache_creation_input_token_cost"),
        ):
            if entry.get(source) is not None:
                fields[target] = entry[source] / 1_000_000
        for tier in entry.get("tiers") or []:
            size = (tier.get("tier") or {}).get("size")
            if not size or size % 1000:
                continue
            suffix = f"_above_{size // 1000}k_tokens"
            if tier.get("input") is not None:
                fields["input_cost_per_token" + suffix] = tier["input"] / 1_000_000
            if tier.get("output") is not None:
                fields["output_cost_per_token" + suffix] = tier["output"] / 1_000_000
        # Optional fallback: pin pricing to a LiteLLM built-in entry instead.
        if entry.get("base_model"):
            fields["base_model"] = entry["base_model"]
        return fields


    def same_cost(desired, current):
        """Compare the reliably-echoed pricing fields, ignoring float noise."""
        for key in COST_SIGNATURE:
            want, have = desired.get(key), current.get(key)
            if want is None and have is None:
                continue
            if want is None or have is None:
                return False
            if isinstance(want, str) or isinstance(have, str):
                if want != have:
                    return False
            elif abs(want - have) > abs(want) * 1e-6:
                return False
        return True


    def existing_models():
        """model_name -> {"id", "model", "mode", "sync_version", "cost"} for drift."""
        result = {}
        for model in proxy_request("/model/info").get("data", []):
            info = model.get("model_info") or {}
            params = model.get("litellm_params") or {}
            # Pricing set via /model/new lands in litellm_params and is echoed
            # into model_info; read both so either shape is detected.
            cost = {}
            for source in (info, model, params):
                for key in COST_SIGNATURE:
                    if source.get(key) is not None:
                        cost[key] = source[key]
            result[model["model_name"]] = {
                "id": info.get("id"),
                "model": params.get("model"),
                "mode": info.get("mode"),
                "sync_version": info.get("sync_version"),
                "cost": cost,
                "bridge": bool(params.get("use_chat_completions_api")),
            }
        return result


    def main():
        existing = existing_models()
        prices = fetch_prices()
        prices_ok = prices is not None
        prices = prices or {}
        overrides = load_overrides()
        if not prices_ok:
            print("pricing from costs.json only this run", flush=True)
        prefixes = {p["prefix"] for p in PROVIDERS}
        desired = set()

        for provider in PROVIDERS:
            try:
                model_ids = discover_models(provider)
            except Exception as error:  # noqa: BLE001
                print(f"[{provider['prefix']}] discovery failed: {error}", flush=True)
                continue
            print(f"[{provider['prefix']}] discovered {len(model_ids)} models", flush=True)
            mode = provider.get("mode", "chat")
            sync_version = provider.get("sync_version")
            for model_id in model_ids:
                name = f"{provider['prefix']}/{model_id}"
                desired.add(name)
                session = f"litellm-{provider['prefix']}-{model_id}"
                current = existing.get(name)
                cost = cost_fields(provider, model_id, prices, overrides, prices_ok)
                bridge = wants_bridge(provider, mode, current)

                recreate = False
                if current and current["id"] is not None:
                    if sync_version is not None and current["sync_version"] != sync_version:
                        recreate = True
                    elif mode != "auto" and (
                        current["model"] != litellm_model_name(provider["provider"], model_id, mode)
                        or current["mode"] != mode
                    ):
                        # A fixed-mode provider moved between adapters/protocols.
                        recreate = True
                    elif current["bridge"] != bridge:
                        # The responses-to-chat bridge was added or removed.
                        recreate = True
                    elif cost is not None and not same_cost(cost, current["cost"]):
                        # Pricing changed (models.dev re-price or new override).
                        recreate = True
                    if not recreate:
                        # Already current: an "auto" deployment keeps its probed
                        # protocol, matching ones are left untouched.
                        continue

                # Resolve the protocol before touching an existing deployment, so a
                # provider that no longer answers a probe leaves the old one intact.
                try:
                    litellm_model, api_base, effective_mode = deployment_for(provider, model_id, session)
                except Exception as error:  # noqa: BLE001
                    print(f"  ! {name}: {error}", flush=True)
                    continue

                if recreate:
                    # /model/update cannot change model_info, so delete + add is
                    # the reliable path for any drift.
                    try:
                        proxy_request("/model/delete", "POST", {"id": current["id"]})
                    except urllib.error.HTTPError as error:
                        print(f"  ! delete {name}: {error.code} {error.read().decode()[:160]}", flush=True)
                        continue

                # Pricing persists on litellm_params; /model/info drops it from
                # model_info. base_model stays on model_info (it is a lookup key,
                # not a cost value).
                litellm_params = {
                    "model": litellm_model,
                    "api_base": api_base,
                    "api_key": "os.environ/" + provider["key_env"],
                }
                if litellm_model.startswith("openai/") and effective_mode == "chat":
                    # Upstream only speaks chat completions: bridge /v1/responses.
                    litellm_params["use_chat_completions_api"] = True
                model_info = {"mode": effective_mode}
                for key, value in (cost or {}).items():
                    if key == "base_model":
                        model_info[key] = value
                    else:
                        litellm_params[key] = value
                if sync_version is not None:
                    model_info["sync_version"] = sync_version
                try:
                    proxy_request(
                        "/model/new",
                        "POST",
                        {
                            "model_name": name,
                            "litellm_params": litellm_params,
                            "model_info": model_info,
                        },
                    )
                    print(f"  + {name} [{effective_mode}]", flush=True)
                except urllib.error.HTTPError as error:
                    print(f"  ! {name}: {error.code} {error.read().decode()[:160]}", flush=True)

        # Drop models this job added previously that the provider no longer lists.
        # Wildcard config entries ("*") and unrelated models are left untouched.
        for name, entry in existing.items():
            if "*" in name or "/" not in name or entry["id"] is None:
                continue
            if name.split("/", 1)[0] in prefixes and name not in desired:
                try:
                    proxy_request("/model/delete", "POST", {"id": entry["id"]})
                    print(f"  - {name}", flush=True)
                except urllib.error.HTTPError as error:
                    print(f"  ! delete {name}: {error.code} {error.read().decode()[:160]}", flush=True)


    if __name__ == "__main__":
        main()
  # Explicit per-model pricing, keyed by <prefix>/<model_id>. Wins over
  # models.dev and fills its gaps. Values are USD per 1M tokens; supported keys
  # are input / output / cache_read / cache_write plus an optional base_model
  # (a LiteLLM built-in cost-map entry to price from instead). Example:
  #   { "zai/glm-4.6": { "input": 0.6, "output": 2.2, "cache_read": 0.11 } }
  costs.json: |
    {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: litellm-model-sync
  namespace: litellm
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: application
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: sync
              image: python:3.13-alpine
              command: ["python3", "/scripts/sync.py"]
              env:
                - name: LITELLM_URL
                  value: "http://litellm:4000"
                - name: LITELLM_MASTER_KEY
                  valueFrom:
                    secretKeyRef:
                      name: litellm-masterkey
                      key: masterkey
                - name: ZAI_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: litellm-env
                      key: ZAI_API_KEY
                - name: INIAD_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: litellm-env
                      key: INIAD_API_KEY
                - name: OPENCODE_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: litellm-env
                      key: OPENCODE_API_KEY
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
          volumes:
            - name: scripts
              configMap:
                name: litellm-model-sync
