# Service URL: http://searxng.searxng.svc.cluster.local:8080
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: searxng
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: application
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.kubito.dev
    chart: searxng
    targetRevision: 1.1.4
    helm:
      values: |
        replicaCount: 2

        # chart kubito/searxng 1.1.4 references .Values.image.pullPolicy, but its values.yaml
        # defines imagePullPolicy; set both keys to Always until the chart is fixed
        image:
          repository: searxng/searxng
          tag: latest
          pullPolicy: Always
          imagePullPolicy: Always

        env:
          - name: TZ
            value: "Asia/Tokyo"
          - name: SEARXNG_PORT
            value: "8080"
          - name: GRANIAN_PORT
            value: "8080"
          - name: FORCE_OWNERSHIP
            value: "false"

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

        config:
          settings:
            enabled: true
            data: |-
              use_default_settings: true

              general:
                instance_name: "SearXNG"

              server:
                secret_key: "$(openssl rand -hex 32)"
                limiter: false
                image_proxy: true
                port: 8080
                bind_address: "0.0.0.0"

              ui:
                static_use_hash: true

              search:
                safe_search: 0
                autocomplete: ""
                default_lang: ""
                formats:
                  - html
                  - json

              botdetection:
                ip_limit: false

              # Explicitly enable bing & mojeek (disabled/inactive by default)
              engines:
                - name: bing
                  disabled: false
                - name: mojeek
                  disabled: false
                  inactive: false
          limiter:
            enabled: false
          uwsgi:
            enabled: false

        ingress:
          enabled: false

        service:
          type: ClusterIP
          port: 8080

  destination:
    server: https://kubernetes.default.svc
    namespace: searxng
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  # Keep the restartedAt annotation set by the searxng-image-updater CronJob
  # so selfHeal does not revert the rollout restart
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: searxng
      jsonPointers:
        - /spec/template/metadata/annotations
