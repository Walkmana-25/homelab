---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: infrastructure
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://fluent.github.io/helm-charts
    chart: fluent-bit
    targetRevision: 0.58.1
    helm:
      values: |
        config:
          customParsers: |
            [PARSER]
                Name docker_no_time
                Format json
                Time_Keep Off
                Time_Key time
                Time_Format %Y-%m-%dT%H:%M:%S.%L

            [PARSER]
                Name docker
                Format json
                Time_Key time
                Time_Format %Y-%m-%dT%H:%M:%S.%L
                Time_Keep On
          service: |
            [SERVICE]
                Flush         10
                Log_Level     info
                Daemon        off
                Parsers_File  parsers.conf
                HTTP_Server   On
                HTTP_Listen   0.0.0.0
                HTTP_Port     2020
          inputs: |
            [INPUT]
                Name              tail
                Path              /var/log/containers/*.log
                multiline.parser  docker, cri
                Parser            docker
                Tag               kube.*
                Mem_Buf_Limit     5MB
                Skip_Long_Lines   On

            [INPUT]
                Name              systemd
                Tag               host.*
                Path              /var/log/journal
                Read_From_Tail    On
                Mem_Buf_Limit     5MB
                Strip_Underscores On
          filters: |
            [FILTER]
                Name                kubernetes
                Match               kube.*
                Merge_Log           Off
                Keep_Log            Off
                K8S-Logging.Parser  On
                K8S-Logging.Exclude On

            [FILTER]
                Name                modify
                Match               kube.*
                Add                 log_type container

            [FILTER]
                Name                modify
                Match               host.*
                Add                 log_type syslog
          outputs: |
            [OUTPUT]
                Name          loki
                Match         kube.*
                Host          loki.monitoring.svc.cluster.local
                Port          3100
                labels        job=fluent-bit, log_type=$log_type, namespace=$kubernetes['namespace_name'], pod=$kubernetes['pod_name'], container=$kubernetes['container_name']

            [OUTPUT]
                Name          loki
                Match         host.*
                Host          loki.monitoring.svc.cluster.local
                Port          3100
                labels        job=fluent-bit, log_type=$log_type
        extraVolumes:
          - name: journal
            hostPath:
              path: /var/log/journal
              type: DirectoryOrCreate
        extraVolumeMounts:
          - name: journal
            mountPath: /var/log/journal
            readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
  ignoreDifferences:
    - group: apps
      kind: DaemonSet
      jsonPointers:
        - /metadata/annotations/deprecated.daemonset.template.generation
