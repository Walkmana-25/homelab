apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alert-rules-k8s
  namespace: monitoring
  labels:
    grafana_alert: "1"
    app.kubernetes.io/part-of: infrastructure
    app.kubernetes.io/name: grafana
data:
  k8s.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: k8s
        folder: Homelab
        interval: 1m
        rules:
          - uid: k8s-node-not-ready
            title: NodeNotReady
            condition: B
            for: 5m
            noDataState: OK
            execErrState: Error
            annotations:
              summary: "Kubernetes node {{ $labels.node }} is NotReady"
            labels:
              severity: critical
            isPaused: false
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: victoriametrics
                model:
                  datasource:
                    type: prometheus
                    uid: victoriametrics
                  editorMode: code
                  expr: kube_node_status_condition{condition="Ready", status="true"} == bool 0
                  instant: true
                  intervalMs: 1000
                  legendFormat: __auto
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: B
                  type: threshold
          - uid: k8s-pod-crashlooping
            title: PodCrashLooping
            condition: B
            for: 15m
            noDataState: OK
            execErrState: Error
            annotations:
              summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is CrashLooping"
            labels:
              severity: warning
            isPaused: false
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: victoriametrics
                model:
                  datasource:
                    type: prometheus
                    uid: victoriametrics
                  editorMode: code
                  expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == bool 1
                  instant: true
                  intervalMs: 1000
                  legendFormat: __auto
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: B
                  type: threshold
          - uid: deployment-replicas-mismatch
            title: DeploymentReplicasMismatch
            condition: B
            for: 15m
            noDataState: OK
            execErrState: Error
            annotations:
              summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} replicas mismatch"
            labels:
              severity: warning
            isPaused: false
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: victoriametrics
                model:
                  datasource:
                    type: prometheus
                    uid: victoriametrics
                  editorMode: code
                  expr: kube_deployment_spec_replicas - kube_deployment_status_replicas_available > bool 0
                  instant: true
                  intervalMs: 1000
                  legendFormat: __auto
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: B
                  type: threshold
          - uid: container-oomkilled
            title: ContainerOOMKilled
            condition: B
            for: 5m
            noDataState: OK
            execErrState: Error
            annotations:
              summary: "Container OOMKilled: {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }})"
            labels:
              severity: warning
            isPaused: false
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: victoriametrics
                model:
                  datasource:
                    type: prometheus
                    uid: victoriametrics
                  editorMode: code
                  expr: increase(kube_pod_container_status_restarts_total[30m]) > 0 and on (namespace, pod, container) kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
                  instant: true
                  intervalMs: 1000
                  legendFormat: __auto
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: B
                  type: threshold
          - uid: pod-image-pull-backoff
            title: PodImagePullBackOff
            condition: B
            for: 10m
            noDataState: OK
            execErrState: Error
            annotations:
              summary: "ImagePullBackOff: {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }})"
            labels:
              severity: warning
            isPaused: false
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: victoriametrics
                model:
                  datasource:
                    type: prometheus
                    uid: victoriametrics
                  editorMode: code
                  expr: kube_pod_container_status_waiting_reason{reason=~"ImagePullBackOff|ErrImagePull"} == bool 1
                  instant: true
                  intervalMs: 1000
                  legendFormat: __auto
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: B
                  type: threshold
