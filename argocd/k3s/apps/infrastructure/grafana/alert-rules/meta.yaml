apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alert-rules-meta
  namespace: monitoring
  labels:
    grafana_alert: "1"
    app.kubernetes.io/part-of: infrastructure
    app.kubernetes.io/name: grafana
data:
  meta.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: meta
        folder: Homelab
        interval: 1m
        rules:
          - uid: kube-state-metrics-down
            title: KubeStateMetricsDown
            condition: B
            for: 5m
            noDataState: Alerting
            execErrState: Alerting
            annotations:
              summary: "kube-state-metrics is down — k8s object alerts are blind"
            labels:
              severity: critical
            isPaused: false
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: victoriametrics
                model:
                  datasource:
                    type: prometheus
                    uid: victoriametrics
                  editorMode: code
                  expr: up{job="kube-state-metrics"} == bool 0
                  instant: true
                  intervalMs: 1000
                  legendFormat: __auto
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: B
                  type: threshold
          - uid: vm-components-down
            title: VMComponentsDown
            condition: B
            for: 5m
            noDataState: Alerting
            execErrState: Alerting
            annotations:
              summary: "VictoriaMetrics component {{ $labels.job }} is down"
            labels:
              severity: critical
            isPaused: false
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: victoriametrics
                model:
                  datasource:
                    type: prometheus
                    uid: victoriametrics
                  editorMode: code
                  expr: up{job=~"vmsingle-victoria-metrics-k8s-stack|vmagent-victoria-metrics-k8s-stack|vmalert-victoria-metrics-k8s-stack|vmalertmanager-victoria-metrics-k8s-stack|victoria-metrics-k8s-stack-victoria-metrics-operator"} == bool 0
                  instant: true
                  intervalMs: 1000
                  legendFormat: __auto
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: B
                  type: threshold
