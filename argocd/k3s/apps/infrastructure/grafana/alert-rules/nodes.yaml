apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alert-rules-nodes
  namespace: monitoring
  labels:
    grafana_alert: "1"
    app.kubernetes.io/part-of: infrastructure
    app.kubernetes.io/name: grafana
data:
  nodes.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: nodes
        folder: Homelab
        interval: 1m
        rules:
          - uid: nodedown
            title: NodeDown
            condition: B
            for: 3m
            noDataState: NoData
            execErrState: Error
            annotations:
              summary: "Node {{ $labels.instance }} is down"
            labels:
              severity: critical
            isPaused: false
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: victoriametrics
                model:
                  datasource:
                    type: prometheus
                    uid: victoriametrics
                  editorMode: code
                  expr: up{job=~"node-exporter-vms|node-exporter"} == bool 0
                  instant: true
                  intervalMs: 1000
                  legendFormat: __auto
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: B
                  type: threshold
          - uid: high-cpu-usage
            title: HighCPUUsage
            condition: B
            for: 10m
            noDataState: OK
            execErrState: Error
            annotations:
              summary: "CPU usage on {{ $labels.instance }} is above 90%"
            labels:
              severity: warning
            isPaused: false
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: victoriametrics
                model:
                  datasource:
                    type: prometheus
                    uid: victoriametrics
                  editorMode: code
                  expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > bool 90
                  instant: true
                  intervalMs: 1000
                  legendFormat: __auto
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: B
                  type: threshold
          - uid: high-memory-usage
            title: HighMemoryUsage
            condition: B
            for: 10m
            noDataState: OK
            execErrState: Error
            annotations:
              summary: "Memory usage on {{ $labels.instance }} is above 90%"
            labels:
              severity: warning
            isPaused: false
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: victoriametrics
                model:
                  datasource:
                    type: prometheus
                    uid: victoriametrics
                  editorMode: code
                  expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > bool 90
                  instant: true
                  intervalMs: 1000
                  legendFormat: __auto
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: B
                  type: threshold
          - uid: cpu-pressure
            title: CPUPressure
            condition: B
            for: 15m
            noDataState: OK
            execErrState: Error
            annotations:
              summary: "CPU pressure (PSI waiting) on {{ $labels.instance }} above 20%"
            labels:
              severity: warning
            isPaused: false
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: victoriametrics
                model:
                  datasource:
                    type: prometheus
                    uid: victoriametrics
                  editorMode: code
                  expr: rate(node_pressure_cpu_waiting_seconds_total[5m]) > bool 0.2
                  instant: true
                  intervalMs: 1000
                  legendFormat: __auto
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: B
                  type: threshold
          - uid: io-pressure
            title: IOPressure
            condition: B
            for: 15m
            noDataState: OK
            execErrState: Error
            annotations:
              summary: "IO pressure (PSI waiting) on {{ $labels.instance }} above 20%"
            labels:
              severity: warning
            isPaused: false
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: victoriametrics
                model:
                  datasource:
                    type: prometheus
                    uid: victoriametrics
                  editorMode: code
                  expr: rate(node_pressure_io_waiting_seconds_total[5m]) > bool 0.2
                  instant: true
                  intervalMs: 1000
                  legendFormat: __auto
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: B
                  type: threshold
          - uid: memory-pressure
            title: MemoryPressure
            condition: B
            for: 15m
            noDataState: OK
            execErrState: Error
            annotations:
              summary: "Memory pressure (PSI waiting) on {{ $labels.instance }} above 10%"
            labels:
              severity: warning
            isPaused: false
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: victoriametrics
                model:
                  datasource:
                    type: prometheus
                    uid: victoriametrics
                  editorMode: code
                  expr: rate(node_pressure_memory_waiting_seconds_total[5m]) > bool 0.1
                  instant: true
                  intervalMs: 1000
                  legendFormat: __auto
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: B
                  type: threshold
          - uid: disk-filling-soon
            title: DiskFillingSoon
            condition: B
            for: 30m
            noDataState: OK
            execErrState: Error
            annotations:
              summary: "Root filesystem on {{ $labels.instance }} predicted to fill within 24h"
            labels:
              severity: warning
            isPaused: false
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: victoriametrics
                model:
                  datasource:
                    type: prometheus
                    uid: victoriametrics
                  editorMode: code
                  expr: predict_linear(node_filesystem_avail_bytes{mountpoint="/"}[6h], 86400) < bool 0
                  instant: true
                  intervalMs: 1000
                  legendFormat: __auto
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: B
                  type: threshold
          - uid: disk-almost-full
            title: DiskAlmostFull
            condition: B
            for: 10m
            noDataState: OK
            execErrState: Error
            annotations:
              summary: "Root filesystem on {{ $labels.instance }} has less than 10% free"
            labels:
              severity: critical
            isPaused: false
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: victoriametrics
                model:
                  datasource:
                    type: prometheus
                    uid: victoriametrics
                  editorMode: code
                  expr: 100 * node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < bool 10
                  instant: true
                  intervalMs: 1000
                  legendFormat: __auto
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: B
                  type: threshold
          - uid: node-pressure-conditions
            title: NodePressureConditions
            condition: B
            for: 10m
            noDataState: OK
            execErrState: Error
            annotations:
              summary: "Node {{ $labels.node }} reports {{ $labels.condition }}"
            labels:
              severity: warning
            isPaused: false
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: victoriametrics
                model:
                  datasource:
                    type: prometheus
                    uid: victoriametrics
                  editorMode: code
                  expr: kube_node_status_condition{condition=~"MemoryPressure|DiskPressure|PIDPressure", status="true"} == bool 1
                  instant: true
                  intervalMs: 1000
                  legendFormat: __auto
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: B
                  type: threshold
