---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: infrastructure
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    targetRevision: 17.4.11
    helm:
      values: |
        fullnameOverride: "loki"

        deploymentMode: Monolithic

        loki:
          commonConfig:
            replication_factor: 1
            path_prefix: /var/loki
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h
          storage:
            type: filesystem
          storage_config:
            filesystem:
              directory: /var/loki/chunks
          auth_enabled: false
          # NOTE: Migration from loki-stack requires fresh data.
          # Old PVC data is not compatible with the new chart's storage format.
          limits_config:
            retention_period: 4380h  # 6 months
            reject_old_samples: true
            reject_old_samples_max_age: 168h
            volume_enabled: true
          compactor:
            retention_enabled: true
            retention_delete_delay: 2h
            delete_request_cancel_period: 2h
            delete_request_store: filesystem

        singleBinary:
          replicas: 1
          persistence:
            enabled: true
            storageClass: nfs
            size: 32Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi

        # Disable all other deployment modes
        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0
        ingester:
          replicas: 0
        querier:
          replicas: 0
        queryFrontend:
          replicas: 0
        queryScheduler:
          replicas: 0
        distributor:
          replicas: 0
        compactor:
          replicas: 0
        indexGateway:
          replicas: 0
        bloomPlanner:
          replicas: 0
        bloomBuilder:
          replicas: 0
        bloomGateway:
          replicas: 0

        # Disable memcached caches (not needed for small homelab)
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false

        # Disable gateway - use Loki directly on port 3100
        gateway:
          enabled: false

        # Disable loki canary
        lokiCanary:
          enabled: false

        # Disable helm test (requires canary)
        test:
          enabled: false

        # Disable minio
        minio:
          enabled: false

        # Disable rollout operator
        rollout_operator:
          enabled: false

        # Disable enterprise features
        enterprise:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
