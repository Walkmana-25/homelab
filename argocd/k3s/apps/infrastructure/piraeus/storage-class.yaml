---
# StorageClass backed by LINSTOR CSI (DRBD with diskless client fallback).
# ext4: LINSTOR 1.34.2 validates FileSystem/Type against (?:ext4|xfs); btrfs is rejected server-side.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ssd
  labels:
    app.kubernetes.io/name: piraeus
    app.kubernetes.io/part-of: infrastructure
  annotations:
    argocd.argoproj.io/sync-wave: "2"
provisioner: linstor.csi.linbit.com
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  linstor.csi.linbit.com/storagePool: "thinpool"
  linstor.csi.linbit.com/layerList: "drbd storage"
  linstor.csi.linbit.com/placementCount: "1"
  linstor.csi.linbit.com/disklessStoragePool: "DfltDisklessStorPool"
  csi.storage.k8s.io/fstype: ext4
