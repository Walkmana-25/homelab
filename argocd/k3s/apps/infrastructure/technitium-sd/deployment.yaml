---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: technitium-sd
  namespace: monitoring
  labels:
    app.kubernetes.io/name: technitium-sd
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: technitium-sd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: technitium-sd
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/part-of: infrastructure
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: technitium-sd
          image: ghcr.io/walkmana-25/technitium-sd:latest
          imagePullPolicy: Always
          env:
            - name: TECHNITIUM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: technitium-sd-token
                  key: token
            - name: TECHNITIUM_URL
              value: "http://10.2.0.1:5380"
            - name: TECHNITIUM_ZONES
              value: "k8s.cloud-milky.solufit.net,vm.cloud-milky.solufit.net"
            - name: TECHNITIUM_EXCLUDE
              value: "k3s-controller-a,k3s-worker-a,k3s-worker-b"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
