---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-metrics-k8s-stack
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: infrastructure
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://victoriametrics.github.io/helm-charts/
    chart: victoria-metrics-k8s-stack
    targetRevision: 0.91.2
    helm:
      valuesObject:
        vmagent:
          spec:
            scrapeInterval: 60s
            # node_exporter on all Proxmox VMs registered in Technitium DNS,
            # discovered via the technitium-sd HTTP SD bridge (same namespace).
            # Labels (cluster/node_type/vm_name) come from the SD service.
            inlineScrapeConfig: |
              - job_name: "node-exporter-vms"
                http_sd_configs:
                  - url: "http://technitium-sd.monitoring.svc.cluster.local:8080/sd"
        # vmsingle PVC: apply nfs storageClass on (re)creation (longhorn -> nfs migration)
        vmsingle:
          spec:
            retentionPeriod: 180d    # 6 months (chart key -> -retentionPeriod=6)
            storage:
              storageClassName: nfs
              resources:
                requests:
                  storage: 40Gi    # was 20Gi; 6-month retention headroom
        grafana:
          enabled: false
        defaultDashboardsEnabled: true
        defaultDashboards:
          labels:
            grafana_dashboard: "1"

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
