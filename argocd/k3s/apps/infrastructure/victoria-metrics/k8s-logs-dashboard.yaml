              "editorMode": "code",
              "expr": "{job=\"fluent-bit\",log_type=\"container\",namespace=~\"$namespace\",pod=~\"$pod\",container=~\"$container\"} | json | line_format \"{{ with .log }}{{ . }}{{ else }}{{ .msg }}{{ end }}\" |~ \"(?i)$search\"",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "Container logs",
          "description": "Search: case-insensitive regex over the raw log line (|~ operator). Empty search matches all lines. Labels shown per row include namespace/pod/container/node.",
