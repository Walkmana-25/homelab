---
# Self-hosted Whisper (OpenAI-compatible) for the auto-manual-generation-system.
#
# Speaches serves /v1/audio/transcriptions with faster-whisper. The lightest
# multilingual model (tiny, 39M params) is used for fast Japanese transcription;
# it is downloaded at startup and cached on the whisper-model-cache PVC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper
  labels:
    app.kubernetes.io/name: whisper
spec:
  replicas: 1
  # Single ReadWriteOnce model cache -> one pod at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: whisper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: whisper
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: speaches
          image: ghcr.io/speaches-ai/speaches:latest-cpu
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            # Lightest multilingual Whisper (Japanese supported).
            - name: WHISPER__MODEL
              value: Systran/faster-whisper-tiny
            - name: WHISPER__INFERENCE_DEVICE
              value: cpu
            - name: WHISPER__COMPUTE_TYPE
              value: int8
            - name: ENABLE_UI
              value: "false"
            - name: LOG_LEVEL
              value: info
          volumeMounts:
            - name: model-cache
              mountPath: /home/ubuntu/.cache/huggingface/hub
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: "2"
              # 2Gi was not enough: the CPU image (onnxruntime + faster-whisper)
              # spiked past the limit during transcription and was OOMKilled.
              memory: 4Gi
          # Covers the model download on first start (liveness/readiness wait).
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: whisper-model-cache
