---
# Speaches does not download models on demand (and this image predates
# PRELOAD_MODELS), so install the tiny model once the server is up. Runs as an
# ArgoCD PostSync hook; the download is idempotent and cached on the PVC.
apiVersion: batch/v1
kind: Job
metadata:
  name: whisper-model-download
  labels:
    app.kubernetes.io/name: whisper
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: whisper
    spec:
      restartPolicy: Never
      containers:
        - name: download
          image: curlimages/curl:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              i=0
              until curl -sf http://whisper:8000/health >/dev/null 2>&1; do
                i=$((i + 1))
                [ "$i" -gt 120 ] && echo "whisper not ready" && exit 1
                sleep 5
              done
              curl -sf -X POST http://whisper:8000/v1/models/Systran/faster-whisper-tiny
              echo "model installed"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
