apiVersion: apps/v1
kind: Deployment
metadata:
  name: headroom
  labels:
    app.kubernetes.io/name: headroom
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: headroom
  # Nodes run at ~95% of their schedulable memory requests, so the default
  # rolling update cannot place its surge pod (a third pod is unschedulable).
  # Roll out by dropping one old pod first instead of temporarily doubling up.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headroom
    spec:
      containers:
        - name: proxy
          image: ghcr.io/headroomlabs-ai/headroom:slim-nonroot-df11f27
          imagePullPolicy: IfNotPresent
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8787"
          env:
            # /v1/compress is loopback-only by default; LiteLLM calls it from
            # another pod, so explicitly allow in-cluster callers.
            - name: HEADROOM_COMPRESS_ALLOW_REMOTE
              value: "1"
            - name: HEADROOM_TELEMETRY
              value: "off"
            # The anonymous upload beacon (session summaries to Headroom Labs)
            # is on by default and is not covered by HEADROOM_TELEMETRY, so turn
            # it off explicitly to keep the pod from calling home.
            - name: HEADROOM_BEACON
              value: "off"
            - name: HEADROOM_PROXY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: headroom-proxy-token
                  key: HEADROOM_PROXY_TOKEN
          ports:
            - containerPort: 8787
              name: http
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
